/* ============================== event wiring ============================== */
var editObraId = null, editContext = {};
var importState = {rows:[], fileName:''};
var lancamentoFiltro = {de:'', ate:''};

function wireDialogsOnce(){
  bindForm('form-nova-obra', onSubmitNovaObra, 'dlg-nova-obra');
  bindForm('form-edit-obra', onSubmitEditObra, 'dlg-edit-obra');
  bindForm('form-lancamento', onSubmitLancamento, 'dlg-lancamento');
  bindForm('form-funcionario', onSubmitFuncionario, 'dlg-funcionario');
  bindForm('form-quinzena', onSubmitQuinzena, 'dlg-quinzena');
  bindForm('form-material', onSubmitMaterial, 'dlg-material');
  bindForm('form-drive', onSubmitDrive, 'dlg-drive');
  bindForm('form-vrund', onSubmitVrUnd, 'dlg-vrund');
  bindForm('form-contrato-qz', onSubmitContratoQuinzena, 'dlg-contrato-qz');
  var tipoSel = document.getElementById('drive-tipo');
  if(tipoSel){
    tipoSel.addEventListener('change', function(){
      document.getElementById('drive-url-field').style.display = tipoSel.value==='link'?'':'none';
      document.getElementById('drive-file-field').style.display = tipoSel.value==='arquivo'?'':'none';
    });
  }
}
function bindForm(formId, handler, dlgId){
  var f = document.getElementById(formId);
  if(!f) return;
  f.addEventListener('submit', function(e){
    e.preventDefault();
    handler(new FormData(f), function(){ document.getElementById(dlgId).close(); });
  });
}
function openDialog(id){ var d = document.getElementById(id); if(d && !d.open) d.showModal(); }

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-action]');
  if(!t) return;
  var a = t.dataset.action;
  if(a==='new-obra'){ document.getElementById('form-nova-obra').reset(); openDialog('dlg-nova-obra'); }
  else if(a==='edit-obra'){ fillEditObra(); openDialog('dlg-edit-obra'); }
  else if(a==='delete-obra'){ deleteObra(); }
  else if(a==='new-lancamento'){ openNewLancamento(); }
  else if(a==='edit-lancamento'){ openEditLancamento(t.dataset.id); }
  else if(a==='delete-lancamento'){ deleteLancamento(t.dataset.id); }
  else if(a==='new-funcionario'){ document.getElementById('form-funcionario').reset(); openDialog('dlg-funcionario'); }
  else if(a==='delete-funcionario'){ deleteFuncionario(t.dataset.nome); }
  else if(a==='new-quinzena'){ document.getElementById('form-quinzena').reset(); openDialog('dlg-quinzena'); }
  else if(a==='delete-quinzena'){ deleteQuinzena(t.dataset.qz); }
  else if(a==='toggle-pago'){ togglePago(t.dataset.qz, t.checked); }
  else if(a==='cycle-code'){ cycleCode(t.dataset.qz, t.dataset.fi, t.dataset.day); }
  else if(a==='remove-func-quinzena'){ removeFuncFromQuinzena(t.dataset.qz, t.dataset.fi); }
  else if(a==='edit-vrund'){ editContext.qz = t.dataset.qz; document.getElementById('form-vrund').reset(); openDialog('dlg-vrund'); }
  else if(a==='new-contrato-quinzena'){ editContext.qz = t.dataset.qz; document.getElementById('form-contrato-qz').reset(); openDialog('dlg-contrato-qz'); }
  else if(a==='download-quinzena-pdf'){ downloadQuinzenaPdf(t.dataset.qz); }
  else if(a==='new-material'){ openNewMaterial(); }
  else if(a==='edit-material'){ openEditMaterial(t.dataset.id); }
  else if(a==='toggle-material'){ toggleMaterial(t.dataset.id); }
  else if(a==='delete-material'){ deleteMaterial(t.dataset.id); }
  else if(a==='new-drive'){ document.getElementById('form-drive').reset(); openDialog('dlg-drive'); }
  else if(a==='delete-drive'){ deleteDrive(t.dataset.id); }
  else if(a==='download-drive'){ downloadDriveItem(t.dataset.id); }
  else if(a==='switch-tab'){ STATE.activeTab = t.dataset.tab; render(); }
  else if(a==='close-dialog'){ document.getElementById(t.dataset.dlg).close(); }
  else if(a==='export-csv'){ exportCsv(); }
  else if(a==='export-xml'){ exportXml(); }
  else if(a==='limpar-filtro'){ lancamentoFiltro.de=''; lancamentoFiltro.ate=''; render(); }
  else if(a==='toggle-theme'){ cycleTheme(); }
  else if(a==='logout'){ doLogout(); }
  else if(a==='usuarios'){ openUsuarios(); }
  else if(a==='perfil-construtora'){ openPerfil(); }
  else if(a==='assinatura'){ openAssinatura(); }
  else if(a==='dono'){ openDono(); }
  else if(a==='import-lancamentos'){ resetImportDialog(); openDialog('dlg-import-lancamentos'); }
  else if(a==='choose-import-file'){ document.getElementById('import-file-input').click(); }
  else if(a==='import-select-all'){ importState.rows.forEach(function(r){r.include=true;}); renderImportPreviewTable(); }
  else if(a==='import-select-none'){ importState.rows.forEach(function(r){r.include=false;}); renderImportPreviewTable(); }
  else if(a==='confirm-import'){ commitImport(); }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if(t.id==='obra-select'){ STATE.selectedObraId = t.value; STATE.activeTab='visao'; render(); schedulePersist(); }
  else if(t.id==='import-file-input'){ handleImportFile(t.files && t.files[0]); }
  else if(t.dataset && t.dataset.action==='edit-contrato'){ editContrato(t.dataset.qz, t.dataset.fi, t.value); }
  else if(t.dataset && t.dataset.action==='add-func-select'){ if(t.value){ addFuncToQuinzena(t.dataset.qz, t.value); t.value=''; } }
  else if(t.dataset && t.dataset.action==='filtro-de'){ lancamentoFiltro.de = t.value; render(); }
  else if(t.dataset && t.dataset.action==='filtro-ate'){ lancamentoFiltro.ate = t.value; render(); }
  else if(t.dataset && t.dataset.action==='import-row-toggle'){ importState.rows[parseInt(t.dataset.idx,10)].include = t.checked; updateImportSummary(); }
  else if(t.dataset && t.dataset.action==='import-row-categoria'){ importState.rows[parseInt(t.dataset.idx,10)].categoria = t.value; }
});

/* ---- mutation handlers ---- */
function obraById(id){ return STATE.obras.find(function(o){return o.id===id;}); }
function findQuinzena(obra, qzId){ return (obra.quinzenas||[]).find(function(q){return q.id===qzId;}); }
function numOr(v,d){ var n = parseFloat(v); return isNaN(n)?(d||0):n; }

function onSubmitNovaObra(fd, close){
  var obra = {
    id: uid('obra'), nomeDono: fd.get('nome')||'Nova obra', endereco: fd.get('endereco')||'', contato: fd.get('contato')||'',
    dataInicio: fd.get('dataInicio')||'', valorVenda: numOr(fd.get('valorVenda')),
    corretor:{percentual:numOr(fd.get('corretorPct')), executado:0},
    lote:{orcado:numOr(fd.get('valorLote')), pagamentos:[]},
    maoDeObra:{orcado:numOr(fd.get('valorMaoObra'))},
    quentinha:{orcado:numOr(fd.get('valorQuentinha'))},
    ledger:[], materiais:[], equipe:[], quinzenas:[], drive:[]
  };
  STATE.obras.push(obra);
  STATE.selectedObraId = obra.id; STATE.activeTab='visao';
  close(); render(); schedulePersist(); toast('Obra cadastrada.');
}
function fillEditObra(){
  var o = currentObra(); if(!o) return;
  var f = document.getElementById('form-edit-obra');
  f.querySelector('[name=nome]').value=o.nomeDono||''; f.querySelector('[name=endereco]').value=o.endereco||''; f.querySelector('[name=contato]').value=o.contato||'';
  f.querySelector('[name=dataInicio]').value=o.dataInicio||''; f.querySelector('[name=valorVenda]').value=o.valorVenda||0;
  f.querySelector('[name=valorLote]').value=o.lote.orcado||0; f.querySelector('[name=valorMaoObra]').value=o.maoDeObra.orcado||0;
  f.querySelector('[name=valorQuentinha]').value=o.quentinha.orcado||0; f.querySelector('[name=corretorPct]').value=o.corretor.percentual||0;
}
function onSubmitEditObra(fd, close){
  var o = currentObra(); if(!o) return close();
  o.nomeDono = fd.get('nome')||o.nomeDono; o.endereco = fd.get('endereco')||''; o.contato = fd.get('contato')||'';
  o.dataInicio = fd.get('dataInicio')||''; o.valorVenda = numOr(fd.get('valorVenda'));
  o.lote.orcado = numOr(fd.get('valorLote')); o.maoDeObra.orcado = numOr(fd.get('valorMaoObra'));
  o.quentinha.orcado = numOr(fd.get('valorQuentinha'));
  o.corretor.percentual = numOr(fd.get('corretorPct'));
  close(); render(); schedulePersist(); toast('Cadastro atualizado.');
}
function deleteObra(){
  var o = currentObra(); if(!o) return;
  if(!confirm('Excluir a obra "'+o.nomeDono+'"? Essa ação não pode ser desfeita.')) return;
  STATE.obras = STATE.obras.filter(function(x){return x.id!==o.id;});
  STATE.selectedObraId = STATE.obras[0] ? STATE.obras[0].id : null;
  render(); schedulePersist(); toast('Obra excluída.');
}
function openNewLancamento(){
  editContext.lancamentoId = null;
  var f = document.getElementById('form-lancamento'); f.reset();
  document.getElementById('lancamento-modal-title').textContent = 'Novo lançamento';
  document.getElementById('lancamento-submit-btn').textContent = 'Adicionar';
  document.getElementById('lanc-recorr-wrap').hidden = false;
  f.querySelector('[name=data]').value = hojeISO();
  var rd=f.querySelector('[name=rec_dia]'); if(rd) delete rd.dataset.mexido;
  syncLancRecorr();
  openDialog('dlg-lancamento');
}
function openEditLancamento(id){
  var o = currentObra(); if(!o) return;
  var l = o.ledger.find(function(x){return x.id===id;}); if(!l) return;
  editContext.lancamentoId = id;
  var f = document.getElementById('form-lancamento'); f.reset();
  f.querySelector('[name=discriminacao]').value = l.discriminacao||'';
  f.querySelector('[name=categoria]').value = l.categoria||'materiais';
  f.querySelector('[name=pagador]').value = l.pagador||'';
  f.querySelector('[name=data]').value = l.data||'';
  f.querySelector('[name=receita]').value = l.receita||0;
  f.querySelector('[name=despesa]').value = l.despesa||0;
  document.getElementById('lanc-recorr-wrap').hidden = true;
  document.getElementById('lancamento-modal-title').textContent = 'Editar lançamento';
  document.getElementById('lancamento-submit-btn').textContent = 'Salvar';
  openDialog('dlg-lancamento');
}
function onSubmitLancamento(fd, close){
  var o = currentObra(); if(!o) return close();
  var fl=document.getElementById('form-lancamento');
  if(!editContext.lancamentoId){
    var recr=lerRecorrencia(fl);
    if(recr && recr.erro){ toast(recr.erro); return; }
    if(recr){
      var vr=numOr(fd.get('receita')), vd=numOr(fd.get('despesa'));
      if(!(vr>0||vd>0)){ toast('Informe o valor da receita ou da despesa.'); return; }
      var ehRec = vr>0;
      gerarRecorrencia(o, {tipo:ehRec?'receita':'despesa', descricao:fd.get('discriminacao')||'Lançamento', categoria:ehRec?'receita':((fd.get('categoria')&&fd.get('categoria')!=='receita')?fd.get('categoria'):'materiais'),
        pessoa:fd.get('pagador')||'', valor:ehRec?vr:vd}, recr, fd.get('data')||hojeISO(), 'quitado');
      close(); render(); schedulePersist(); return;
    }
  }
  if(editContext.lancamentoId){
    var l = o.ledger.find(function(x){return x.id===editContext.lancamentoId;});
    if(l){
      l.discriminacao = fd.get('discriminacao')||l.discriminacao; l.categoria = fd.get('categoria')||l.categoria;
      l.pagador = fd.get('pagador')||''; l.data = fd.get('data')||'';
      l.receita = numOr(fd.get('receita')); l.despesa = numOr(fd.get('despesa'));
    }
    editContext.lancamentoId = null;
    close(); render(); schedulePersist(); toast('Lançamento atualizado.');
    return;
  }
  o.ledger.push({
    id: uid('lan'), discriminacao: fd.get('discriminacao')||'Lançamento', categoria: fd.get('categoria')||'materiais',
    pagador: fd.get('pagador')||'', data: fd.get('data')||'',
    receita: numOr(fd.get('receita')), despesa: numOr(fd.get('despesa'))
  });
  close(); render(); schedulePersist(); toast('Lançamento adicionado.');
}
function deleteLancamento(id){
  var o = currentObra(); if(!o) return;
  o.ledger = o.ledger.filter(function(l){return l.id!==id;});
  contasDe(o).forEach(function(c){ if(c.lancamentoId===id){ c.status='aberto'; delete c.pagoEm; delete c.valorPago; delete c.lancamentoId; } });
  render(); schedulePersist();
}
function onSubmitFuncionario(fd, close){
  var o = currentObra(); if(!o) return close();
  var nome = fd.get('nome'); if(!nome) return close();
  if(!o.equipe.some(function(f){return f.nome===nome;})){
    o.equipe.push({nome:nome, cargo:fd.get('cargo')||'', diariaPadrao:numOr(fd.get('diaria'))});
  }
  close(); render(); schedulePersist(); toast('Funcionário adicionado à equipe.');
}
function deleteFuncionario(nome){
  var o = currentObra(); if(!o) return;
  o.equipe = o.equipe.filter(function(f){return f.nome!==nome;});
  render(); schedulePersist();
}
function onSubmitQuinzena(fd, close){
  var o = currentObra(); if(!o) return close();
  var inicio = fd.get('inicio'), fim = fd.get('fim');
  var days = [];
  if(inicio && fim && inicio<=fim){
    daysBetweenInclusive(inicio,fim).forEach(function(iso){ days.push({dow:dowOf(iso), num:dayNumOf(iso)}); });
  }
  o.quinzenas.push({
    id: uid('qz'), titulo: fd.get('titulo')||'Nova quinzena', days: days, vrUnd: numOr(fd.get('vrUnd')),
    pago:false, funcionarios:[]
  });
  close(); render(); schedulePersist(); toast('Quinzena criada.');
}
function deleteQuinzena(qzId){
  var o = currentObra(); if(!o) return;
  if(!confirm('Excluir esta quinzena?')) return;
  o.quinzenas = o.quinzenas.filter(function(q){return q.id!==qzId;});
  render(); schedulePersist();
}
function togglePago(qzId, checked){
  var o = currentObra(); if(!o) return;
  var qz = findQuinzena(o,qzId); if(!qz) return;
  qz.pago = !!checked;
  render(); schedulePersist();
}
function addFuncToQuinzena(qzId, nome){
  var o = currentObra(); if(!o) return;
  var qz = findQuinzena(o,qzId); if(!qz) return;
  var roster = o.equipe.find(function(f){return f.nome===nome;});
  var codes = (qz.days||[]).map(function(){return '';});
  qz.funcionarios.push({nome:nome, cargo: roster?roster.cargo:'', diaria: roster?roster.diariaPadrao:0, codes:codes, contrato:0, diariaTotal:0, total:0});
  render(); schedulePersist();
}
function removeFuncFromQuinzena(qzId, fi){
  var o = currentObra(); if(!o) return;
  var qz = findQuinzena(o,qzId); if(!qz) return;
  qz.funcionarios.splice(parseInt(fi,10),1);
  render(); schedulePersist();
}
function cycleCode(qzId, fi, dayIdx){
  var o = currentObra(); if(!o) return;
  var qz = findQuinzena(o,qzId); if(!qz) return;
  var f = qz.funcionarios[parseInt(fi,10)]; if(!f) return;
  var di = parseInt(dayIdx,10);
  f.codes[di] = nextCode(f.codes[di]);
  recalcFuncionario(f);
  render(); schedulePersist();
}
function editContrato(qzId, fi, val){
  var o = currentObra(); if(!o) return;
  var qz = findQuinzena(o,qzId); if(!qz) return;
  var f = qz.funcionarios[parseInt(fi,10)]; if(!f) return;
  f.contrato = numOr(val);
  f.total = round2((f.diariaTotal||0)+(f.contrato||0));
  render(); schedulePersist();
}
function onSubmitVrUnd(fd, close){
  var o = currentObra(); if(!o) return close();
  var qz = findQuinzena(o, editContext.qz); if(!qz) return close();
  qz.vrUnd = numOr(fd.get('vrUnd'));
  close(); render(); schedulePersist();
}
function onSubmitContratoQuinzena(fd, close){
  var o = currentObra(); if(!o) return close();
  var qz = findQuinzena(o, editContext.qz); if(!qz) return close();
  var valor = numOr(fd.get('valor'));
  var codes = (qz.days||[]).map(function(){return '';});
  qz.funcionarios.push({nome: fd.get('descricao')||'Contrato', cargo:'Contrato', diaria:0, codes:codes, contrato:valor, diariaTotal:0, total:valor});
  close(); render(); schedulePersist(); toast('Lançamento de contrato adicionado.');
}
function openNewMaterial(){
  editContext.materialId = null;
  document.getElementById('form-material').reset();
  document.getElementById('material-modal-title').textContent = 'Novo item previsto';
  document.getElementById('material-submit-btn').textContent = 'Adicionar';
  openDialog('dlg-material');
}
function openEditMaterial(id){
  var o = currentObra(); if(!o) return;
  var m = o.materiais.find(function(x){return x.id===id;}); if(!m) return;

function dataUrlToBlob(dataUrl){
  var parts = dataUrl.split(','); var mime = parts[0].match(/:(.*?);/)[1];
  var bin = atob(parts[1]); var arr = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}

function csvEscape(v){
  v = (v===undefined||v===null) ? '' : String(v);
  if(/^[=+\-@\t\r]/.test(v)) v = "'"+v; // evita fórmula maliciosa ao abrir no Excel
  if(/[";\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
  return v;
}

  var up = document.getElementById('import-step-upload'); if(up) up.style.display='';
  var pv = document.getElementById('import-preview-wrap'); if(pv) pv.style.display='none';

function normalizeHeader(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}
function parseBRNumber(v){
  if(v===undefined||v===null||v==='') return 0;
  if(typeof v==='number') return v;
  var s = String(v).trim();
  if(!s) return 0;
  var neg = /^\(.*\)$/.test(s);
  s = s.replace(/[^\d,.\-]/g,'');
  if(!s) return 0;
  if(s.indexOf(',')>=0 && s.indexOf('.')>=0){ s = s.replace(/\./g,'').replace(',', '.'); }
  else if(s.indexOf(',')>=0){ s = s.replace(',', '.'); }
  var n = parseFloat(s);
  if(isNaN(n)) return 0;
  return neg ? -Math.abs(n) : n;
}
function parseFlexDate(v){
  if(v===undefined||v===null||v==='') return '';
  var s = String(v).trim();
  var m;
  if((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[1]+'-'+m[2]+'-'+m[3];
  if((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/))){
    return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  }
  if((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2})$/))){
    var y = (parseInt(m[3],10)<70?'20':'19')+m[3];
    return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  }
  if(/^\d+(\.\d+)?$/.test(s)){
    var serial = parseFloat(s);
    if(serial>20000 && serial<80000){
      var dt = new Date(Date.UTC(1899,11,30) + Math.round(serial)*86400000);
      return dt.toISOString().slice(0,10);
    }
  }
  return s;
}
function parseCsvLine(line, delim){
  var result = [], cur='', inQuotes=false;
  for(var i=0;i<line.length;i++){
    var c = line[i];
    if(inQuotes){
      if(c==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else { inQuotes=false; } }
      else { cur+=c; }
    } else {
      if(c==='"'){ inQuotes=true; }
      else if(c===delim){ result.push(cur); cur=''; }
      else { cur+=c; }
    }
  }
  result.push(cur);
  return result;
}
function parseCsvText(text){
  text = text.replace(/^\uFEFF/, '');
  var firstLine = (text.split(/\r\n|\n|\r/)[0])||'';
  var delim = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';
  var lines = text.split(/\r\n|\n|\r/).filter(function(l){return l.length>0;});
  return lines.map(function(line){ return parseCsvLine(line, delim); });
}
function guessCategoria(txt, receita){
  if(txt){
    if(txt.indexOf('mao de obra')>=0 || txt.indexOf('maodeobra')>=0 || txt.indexOf('mao obra')>=0) return 'maoDeObra';
    if(txt.indexOf('quentinha')>=0) return 'quentinha';
    if(txt.indexOf('material')>=0) return 'materiais';
    if(txt.indexOf('lote')>=0) return 'lote';
    if(txt.indexOf('corretor')>=0) return 'corretor';
    if(txt.indexOf('receita')>=0 || txt.indexOf('recebiment')>=0) return 'receita';
  }
  return receita>0 ? 'receita' : 'materiais';
}
function mapImportRows(rows){
  if(!rows || !rows.length) return [];
  var header = rows[0].map(normalizeHeader);
  function findCol(patterns){
    for(var i=0;i<header.length;i++){
      for(var p=0;p<patterns.length;p++){
        if(header[i].indexOf(patterns[p])>=0) return i;
      }
    }
    return -1;
  }
  var idxDiscr = findCol(['discrimina','descri','historico','lancamento','item']);
  var idxData = findCol(['data']);
  var idxReceita = findCol(['receita','credito','entrada']);
  var idxDespesa = findCol(['despesa','debito','saida']);
  var idxValor = findCol(['valor']);
  var idxTipo = findCol(['tipo','natureza']);
  var idxCategoria = findCol(['categoria']);
  var idxPagador = findCol(['pagador','fornecedor','cliente','responsavel']);

  var dataRows = rows.slice(1).filter(function(r){
    return r.some(function(c){ return String(c===undefined||c===null?'':c).trim()!==''; });
  });

  return dataRows.map(function(r){
    var discriminacao = idxDiscr>=0 ? String(r[idxDiscr]||'').trim() : '';
    var dataVal = idxData>=0 ? parseFlexDate(r[idxData]) : '';
    var receita=0, despesa=0;
    if(idxReceita>=0 || idxDespesa>=0){
      receita = idxReceita>=0 ? parseBRNumber(r[idxReceita]) : 0;
      despesa = idxDespesa>=0 ? parseBRNumber(r[idxDespesa]) : 0;
    } else if(idxValor>=0){
      var v = parseBRNumber(r[idxValor]);
      var tipoTxt = idxTipo>=0 ? normalizeHeader(r[idxTipo]) : '';
      if(tipoTxt.indexOf('despes')>=0 || tipoTxt.indexOf('debit')>=0 || tipoTxt.indexOf('saida')>=0){ despesa = Math.abs(v); }
      else if(tipoTxt.indexOf('receit')>=0 || tipoTxt.indexOf('credit')>=0 || tipoTxt.indexOf('entrada')>=0){ receita = Math.abs(v); }
      else if(v<0){ despesa = Math.abs(v); } else { receita = v; }
    }
    var catTxt = idxCategoria>=0 ? normalizeHeader(r[idxCategoria]) : '';
    var categoria = guessCategoria(catTxt, receita);
    var pagador = idxPagador>=0 ? String(r[idxPagador]||'').trim() : '';
    return {discriminacao: discriminacao||'(sem descrição)', data: dataVal, receita: round2(Math.abs(receita)), despesa: round2(Math.abs(despesa)), categoria: categoria, pagador: pagador, include:true};
  }).filter(function(row){ return row.discriminacao!=='(sem descrição)' || row.receita || row.despesa; });
}
async function handleImportFile(file){
  if(!file) return;
  if(file.size > 5*1024*1024){ toast('Planilha maior que 5 MB. Divida o arquivo ou salve como CSV.'); return; }
  if(!/\.(csv|xlsx|xls)$/i.test(file.name)){ toast('Envie um arquivo CSV, XLS ou XLSX.'); return; }
  var nameEl = document.getElementById('import-file-name');
  if(nameEl) nameEl.textContent = 'Lendo "'+file.name+'"…';
  try{
    var lower = file.name.toLowerCase();
    var rows;
    if(lower.endsWith('.csv')){
      var text = await file.text();
      rows = parseCsvText(text);
    } else {
      if(typeof XLSX==='undefined'){
        toast('O leitor de planilhas não carregou (verifique a conexão) — tente novamente ou envie um arquivo CSV.');
        resetImportDialog();
        return;
      }
      var buf = await file.arrayBuffer();
      var wb = XLSX.read(buf, {type:'array'});
      var sheet = wb.Sheets[wb.SheetNames[0]];
      rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
    }
    var parsed = mapImportRows(rows);
    if(!parsed.length){
      toast('Não encontramos linhas de dados nessa planilha. Confira o arquivo e tente novamente.');
      resetImportDialog();
      return;
    }
    importState.rows = parsed;
    importState.fileName = file.name;
    if(nameEl) nameEl.textContent = '';
    document.getElementById('import-step-upload').style.display='none';
    document.getElementById('import-preview-wrap').style.display='';
    document.getElementById('import-confirm-btn').style.display='';
    renderImportPreviewTable();
  }catch(err){
    toast('Não foi possível ler esse arquivo. Verifique o formato e tente novamente.');
    resetImportDialog();
  }
}

/* ============================== persistência (Supabase) ============================== */
// A conexão vem das tags <meta name="supabase-url"> e <meta name="supabase-key"> no topo do arquivo.
// Use somente a chave pública (anon/publishable). Nunca a service_role.
function metaConfig(n){ var m=document.querySelector('meta[name="'+n+'"]'); return m ? (m.getAttribute('content')||'').trim() : ''; }
var SUPABASE_URL = metaConfig('supabase-url');
var SUPABASE_ANON_KEY = metaConfig('supabase-key');
var configErro = '';
if(!SUPABASE_URL || !SUPABASE_ANON_KEY) configErro = 'Conexão com o banco não configurada.';
else if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(SUPABASE_URL)) configErro = 'Endereço do Supabase inválido. Use o formato https://seu-projeto.supabase.co';
else if(/service_role|sb_secret_/i.test(SUPABASE_ANON_KEY) || /"role"\s*:\s*"service_role"/.test(jwtPayload(SUPABASE_ANON_KEY))) configErro = 'A chave informada é a SECRETA (service_role). Troque pela chave pública e revogue essa chave no Supabase.';
function jwtPayload(t){ try{ return atob(String(t).split('.')[1].replace(/-/g,'+').replace(/_/g,'/')); }catch(e){ return ''; } }

var supabaseClient = null;
var supabaseReady = false;
if(!configErro && typeof window.supabase !== 'undefined'){
  try{ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); supabaseReady = true; }
  catch(e){ configErro = 'Não foi possível iniciar a conexão com o banco.'; }
}else if(!configErro){ configErro = 'A biblioteca do banco não carregou. Verifique a internet e recarregue a página.'; }

/* construtora ativa: {cid, nome, papel: 'admin' | 'editor' | 'leitor'} */
var CTX = null;
function podeEditar(){ return CTX && (CTX.papel==='admin' || CTX.papel==='editor'); }
function ehAdmin(){ return CTX && CTX.papel==='admin'; }
function estadoVazio(){ return {selectedObraId:null, obras:[], activeTab:'visao'}; }

var saveTimer = null;
var cloudFalhou = false; // nunca grava por cima da nuvem se não conseguiu ler
function setSaveStatus(mode){
  var dot = document.getElementById('save-dot'), label = document.getElementById('save-label');
  if(!dot) return;
  if(CTX && !podeEditar()){ dot.className='save-dot off'; label.textContent='Somente visualização'; return; }
  dot.className = 'save-dot'+(mode==='busy'?' busy':(mode==='off'?' off':''));
  label.textContent = mode==='busy' ? 'Salvando…' : (mode==='off' ? 'Sem conexão' : 'Sincronizado');
}
function schedulePersist(){
  if(!podeEditar()) return;
  if(cloudFalhou){ setSaveStatus('off'); toast('Sem conexão com a nuvem: a alteração não foi salva. Recarregue a página.'); return; }
  clearTimeout(saveTimer); setSaveStatus('busy');
  saveTimer = setTimeout(doPersist, 700);
}
async function doPersist(){
  if(!podeEditar() || !supabaseReady || cloudFalhou) return;
  try{
    var res = await supabaseClient.from('painel_dados').upsert({construtora_id: CTX.cid, data: STATE});

/* ---------- validação dos dados vindos do banco ----------
   Qualquer usuário com permissão de edição consegue gravar o JSON direto pela API.
   Por isso tudo o que é carregado passa por aqui antes de aparecer na tela. */
var RX_ID = /^[A-Za-z0-9_-]{1,64}$/, RX_DATA = /^\d{4}-\d{2}-\d{2}$/;
var CATS_OK = ['receita','lote','materiais','maoDeObra','quentinha','corretor'];
function sId(v, pref){ v=String(v==null?'':v); return RX_ID.test(v) ? v : uid(pref||'id'); }
function sTxt(v, max){ return v==null ? '' : String(v).slice(0, max||500); }
function sNum(v){ var n=Number(v); return isFinite(n) ? Math.round(n*100)/100 : 0; }
function sData(v){ return RX_DATA.test(String(v||'')) ? String(v) : ''; }
function sCat(v){ return CATS_OK.indexOf(v)>=0 ? v : 'materiais'; }
function sArr(v){ return Array.isArray(v) ? v : []; }
function urlSegura(u){ try{ var x=new URL(String(u||'')); return (x.protocol==='https:'||x.protocol==='http:') ? x.href : ''; }catch(e){ return ''; } }
function dataUrlSegura(u){ u=String(u||''); return /^data:[a-z0-9.+\/-]{1,80};base64,[A-Za-z0-9+\/=]+$/i.test(u) ? u : ''; }
function sanearEstado(st){
  if(!st || typeof st!=='object') return estadoVazio();
  var out = {selectedObraId:null, activeTab: ['visao','lancamentos','contas','calendario','maodeobra','materiais','drive'].indexOf(st.activeTab)>=0 ? st.activeTab : 'visao', obras:[]};
  sArr(st.obras).forEach(function(o){
    if(!o || typeof o!=='object') return;
    o.id = sId(o.id,'obra'); o.nomeDono=sTxt(o.nomeDono,200)||'Obra'; o.endereco=sTxt(o.endereco,300); o.contato=sTxt(o.contato,200);
    o.dataInicio=sData(o.dataInicio); o.valorVenda=sNum(o.valorVenda);
    o.corretor = {percentual: sNum(o.corretor&&o.corretor.percentual), executado: sNum(o.corretor&&o.corretor.executado)};
    o.lote = {orcado:sNum(o.lote&&o.lote.orcado), pagamentos:sArr(o.lote&&o.lote.pagamentos).filter(Boolean).map(function(p){ return {valor:sNum(p.valor), data:sData(p.data), obs:sTxt(p.obs,200)}; })};
    o.maoDeObra = {orcado:sNum(o.maoDeObra&&o.maoDeObra.orcado)};
    o.quentinha = {orcado:sNum(o.quentinha&&o.quentinha.orcado)};
    o.ledger = sArr(o.ledger).filter(Boolean).map(function(l){ return {id:sId(l.id,'lan'), discriminacao:sTxt(l.discriminacao,300), categoria:sCat(l.categoria),
      pagador:sTxt(l.pagador,200), data:sData(l.data), receita:sNum(l.receita), despesa:sNum(l.despesa), contaId:l.contaId?sId(l.contaId):undefined, grupo:l.grupo?sId(l.grupo):undefined}; });
    o.contas = sArr(o.contas).filter(Boolean).map(function(c){ return {id:sId(c.id,'cta'), tipo:c.tipo==='receber'?'receber':'pagar', descricao:sTxt(c.descricao,300), pessoa:sTxt(c.pessoa,200),
      categoria:sCat(c.categoria), valor:sNum(c.valor), vencimento:sData(c.vencimento)||hojeISO(), status:c.status==='pago'?'pago':'aberto', pagoEm:sData(c.pagoEm)||undefined,
      valorPago:c.valorPago!=null?sNum(c.valorPago):undefined, lancamentoId:c.lancamentoId?sId(c.lancamentoId):undefined, obs:sTxt(c.obs,300), grupo:c.grupo?sId(c.grupo):null,
      recorrente:c.recorrente?{dia:Math.min(31,Math.max(1,sNum(c.recorrente.dia)|0)), meses:Math.min(120,Math.max(1,sNum(c.recorrente.meses)|0))}:undefined, criadoEm:sTxt(c.criadoEm,40)}; });
    o.materiais = sArr(o.materiais).filter(Boolean).map(function(m){ m.id=sId(m.id,'mat'); Object.keys(m).forEach(function(k){ if(typeof m[k]==='number') m[k]=sNum(m[k]); else if(typeof m[k]==='string' && k!=='id') m[k]=sTxt(m[k],300); }); return m; });
    o.equipe = sArr(o.equipe).filter(Boolean).map(function(f){ return {nome:sTxt(f.nome,120), cargo:sTxt(f.cargo,120), diariaPadrao:sNum(f.diariaPadrao)}; });
    o.quinzenas = sArr(o.quinzenas).filter(Boolean).map(function(q){
      q.id=sId(q.id,'qz'); q.inicio=sData(q.inicio); q.fim=sData(q.fim); q.pago=!!q.pago;
      Object.keys(q).forEach(function(k){ if(typeof q[k]==='number') q[k]=sNum(q[k]); else if(typeof q[k]==='string' && ['id','inicio','fim'].indexOf(k)<0) q[k]=sTxt(q[k],200); });
      q.days = sArr(q.days).filter(Boolean).map(function(d){ return {dow: DOW_PT.indexOf(d.dow)>=0?d.dow:'', num: Math.min(31,Math.max(0,sNum(d.num)|0))}; });
      q.funcionarios = sArr(q.funcionarios).filter(Boolean).map(function(f){
        Object.keys(f).forEach(function(k){ if(typeof f[k]==='number') f[k]=sNum(f[k]); else if(typeof f[k]==='string') f[k]=sTxt(f[k],200); });
        f.codes = sArr(f.codes).map(function(c){ return CODES.indexOf(c)>=0 ? c : ''; });
        return f; });
      return q; });
    o.drive = sArr(o.drive).filter(Boolean).map(function(d){
      var it = {id:sId(d.id,'drv'), nome:sTxt(d.nome,200)||'Arquivo', categoria:sTxt(d.categoria,60), tipo:d.tipo==='link'?'link':'arquivo', data:sData(d.data)};
      if(it.tipo==='link') it.url=urlSegura(d.url); else { it.dataUrl=dataUrlSegura(d.dataUrl); it.mime=sTxt(d.mime,80); it.tamanho=sNum(d.tamanho); }
      return it; });
    out.obras.push(o);
  });
  var sel = st.selectedObraId;
  out.selectedObraId = out.obras.some(function(o){ return o.id===sel; }) ? sel : (out.obras[0] ? out.obras[0].id : null);
  return out;
}

/* ============================== downloads (funciona em qualquer navegador) ============================== */
function saveFile(filename, data){
  try{
    var blob = (data instanceof Blob) ? data : new Blob([data], {type:'text/plain;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    return true;
  }catch(e){ return false; }
}

var DESP_CATS = ['materiais','maoDeObra','quentinha','lote','corretor'];
var MESES_LONGOS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function hojeISO(){ var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function addMeses(iso, n){
  var p=iso.split('-').map(Number), y=p[0], m=p[1]-1+n, d=p[2];
  y += Math.floor(m/12); m = ((m%12)+12)%12;
  var ult = new Date(y, m+1, 0).getDate();
  return y+'-'+String(m+1).padStart(2,'0')+'-'+String(Math.min(d,ult)).padStart(2,'0');
}
function diffDias(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function parseValor(v){
  v = String(v==null?'':v).trim().replace(/R\$\s?/i,'').replace(/\s/g,'');
  if(v.indexOf(',')>=0) v = v.replace(/\./g,'').replace(',','.');
  var n = parseFloat(v); return isNaN(n) ? 0 : round2(n);
}
function fmtValorInput(n){ return n ? Number(n).toFixed(2).replace('.',',') : ''; }
function contasDe(o){ if(!o.contas) o.contas=[]; return o.contas; }
function obraById(id){ return STATE.obras.find(function(o){ return o.id===id; }) || null; }
function obrasDoFiltro(){ return FIN.obra==='todas' ? STATE.obras : [currentObra()].filter(Boolean); }
function listaContas(filtroTipo){
  var out=[];
  obrasDoFiltro().forEach(function(o){ contasDe(o).forEach(function(c){ if(!filtroTipo || filtroTipo==='ambos' || c.tipo===filtroTipo) out.push({c:c, o:o}); }); });
  return out;
}
function situacao(c){
  var hoje=hojeISO();
  if(c.status==='pago') return {k:'pago', label:(c.tipo==='pagar'?'Paga':'Recebida')+' em '+fmtDate(c.pagoEm), cls:'badge-good'};
  var d = diffDias(hoje, c.vencimento);
  if(d<0) return {k:'vencida', label:'Vencida há '+(-d)+' dia'+(d===-1?'':'s'), cls:'badge-crit'};
  if(d===0) return {k:'hoje', label:'Vence hoje', cls:'badge-warn'};
  if(d<=7) return {k:'semana', label:'Vence em '+d+' dia'+(d===1?'':'s'), cls:'badge-warn'};
  return {k:'aberta', label:'Em aberto', cls:'badge-muted'};
}
function obraSelectHtml(name, selId){

/* ---------- recorrência mensal ---------- */
function diaNoMes(ym, dia){
  var y=+ym.slice(0,4), m=+ym.slice(5,7), ult=new Date(y, m, 0).getDate();
  return ym.slice(0,7)+'-'+String(Math.min(Math.max(1,dia|0), ult)).padStart(2,'0');
}
function datasRecorrencia(inicio, dia, meses){
  var out=[], ym=inicio.slice(0,7);
  if(diaNoMes(ym, dia) < inicio) ym = addMeses(ym+'-01', 1).slice(0,7); // o dia já passou neste mês: começa no próximo
  for(var i=0;i<meses;i++) out.push(diaNoMes(addMeses(ym+'-01', i), dia));
  return out;
}
function recorrenciaBlock(){
  return '<div class="recorr-box">' +
    '<label class="switch"><input type="checkbox" name="recorrente"><span class="sw"></span><span>Repetir todo mês</span></label>' +
    '<div class="recorr" hidden>' +
      '<div class="recorr-linha">Todo dia <input name="rec_dia" type="number" min="1" max="31" inputmode="numeric" aria-label="Dia do mês"> durante <input name="rec_meses" type="number" min="2" max="120" value="12" inputmode="numeric" aria-label="Quantidade de meses"> meses</div>' +
      '<label class="auth-check recorr-num"><input type="checkbox" name="rec_numerar"> Numerar como parcelas (1/12, 2/12…)</label>' +
      '<div class="recorr-prev"></div>' +
    '</div></div>';
}
/* modo: 'quitado' (lança no extrato o que já passou) | 'conta' (tudo vira conta) */
function lerRecorrencia(f){
  if(!f.querySelector('[name=recorrente]') || !f.querySelector('[name=recorrente]').checked) return null;
  var dia=parseInt(f.querySelector('[name=rec_dia]').value,10), meses=parseInt(f.querySelector('[name=rec_meses]').value,10);
  if(!(dia>=1&&dia<=31)) return {erro:'Informe o dia do mês (1 a 31).'};
  if(!(meses>=2&&meses<=120)) return {erro:'Informe de 2 a 120 meses.'};
  return {dia:dia, meses:meses, numerar:f.querySelector('[name=rec_numerar]').checked};
}
function syncRecorrencia(f, dataName, modo, valor, rec){
  var box=f.querySelector('.recorr-box'); if(!box) return;
  var on=f.querySelector('[name=recorrente]').checked, wrap=box.querySelector('.recorr');
  wrap.hidden=!on;
  var diaEl=f.querySelector('[name=rec_dia]'), dataEl=f.querySelector('[name='+dataName+']');
  if(dataEl && dataEl.value && !diaEl.dataset.mexido) diaEl.value=+dataEl.value.slice(8,10);
  if(!on) return;
  var r=lerRecorrencia(f), prev=box.querySelector('.recorr-prev');
  if(!r || r.erro){ prev.textContent = r ? r.erro : ''; prev.className='recorr-prev err'; return; }
  var inicio=(dataEl&&dataEl.value)||hojeISO(), datas=datasRecorrencia(inicio, r.dia, r.meses), hoje=hojeISO();
  var nExtrato = modo==='quitado' ? datas.filter(function(d){ return d<=hoje; }).length : 0, nContas=datas.length-nExtrato;
  var conta = rec ? 'Contas a receber' : 'Contas a pagar';
  var txt = r.meses+' lançamentos'+(valor>0?' de '+fmtBRL(valor):'')+', de '+fmtDate(datas[0])+' a '+fmtDate(datas[datas.length-1])+(valor>0?' · total '+fmtBRL(valor*r.meses):'')+'. ';
  if(nExtrato && nContas) txt += nExtrato+' já '+(nExtrato>1?'passaram e entram':'passou e entra')+' no extrato como '+(rec?'recebido':'pago')+(nExtrato>1?'s':'')+'; os outros '+nContas+' vão para '+conta+'.';
  else if(nExtrato) txt += 'Todos já passaram e entram no extrato como '+(rec?'recebidos':'pagos')+'.';
  else txt += 'Todos vão para '+conta+' e entram no extrato quando você der baixa.';
  prev.textContent=txt; prev.className='recorr-prev';
}
function gerarRecorrencia(o, base, r, inicio, modo){
  var datas=datasRecorrencia(inicio, r.dia, r.meses), hoje=hojeISO(), grupo=uid('rec'), rec=base.tipo==='receita', nL=0, nC=0;
  o.ledger=o.ledger||[];
  datas.forEach(function(d,i){
    var desc=base.descricao+(r.numerar?' ('+(i+1)+'/'+r.meses+')':'');
    if(modo==='quitado' && d<=hoje){
      o.ledger.push({id:uid('lan'), discriminacao:desc, categoria:base.categoria, pagador:base.pessoa||'', data:d, receita:rec?base.valor:0, despesa:rec?0:base.valor, grupo:grupo});
      nL++;
    }else{
      contasDe(o).push({id:uid('cta'), tipo:rec?'receber':'pagar', descricao:desc, pessoa:base.pessoa||'', categoria:base.categoria, valor:base.valor,
        vencimento:d, status:'aberto', obs:base.obs||'', grupo:grupo, recorrente:{dia:r.dia, meses:r.meses}, criadoEm:new Date().toISOString()});
      nC++;
    }
  });
  var partes=[]; if(nL) partes.push(nL+' no extrato'); if(nC) partes.push(nC+' em contas a '+(rec?'receber':'pagar'));
  toast('Recorrência criada: todo dia '+r.dia+' por '+r.meses+' meses ('+partes.join(' e ')+').');
}

/* ---------- lançamento rápido ---------- */
function openRapido(tipo){
  var d=document.getElementById('dlg-rapido'); if(!d) return;
  var f=document.getElementById('form-rapido'); f.reset();
  f.querySelector('[name=tipo][value='+(tipo==='receita'?'receita':'despesa')+']').checked=true;
  f.querySelector('[name=data]').value=hojeISO();
  var ob=f.querySelector('[name=obra]'); if(ob) ob.value=STATE.selectedObraId||(currentObra()||{}).id;
  var rd=f.querySelector('[name=rec_dia]'); if(rd) delete rd.dataset.mexido;
  preencherSugestoes();
  syncRapido();
  d.showModal();
  setTimeout(function(){ f.querySelector('[name=valor]').focus(); }, 30);
}
function preencherSugestoes(){
  var desc={}, pess={};
  STATE.obras.forEach(function(o){
    (o.ledger||[]).slice(-200).forEach(function(l){ if(l.discriminacao) desc[l.discriminacao]=1; if(l.pagador) pess[l.pagador]=1; });
    contasDe(o).forEach(function(c){ if(c.pessoa) pess[c.pessoa]=1; });
  });
  var a=document.getElementById('rapido-sugestoes'), b=document.getElementById('rapido-pessoas');
  if(a) a.innerHTML=Object.keys(desc).slice(-80).map(function(x){ return '<option value="'+esc(x)+'">'; }).join('');
  if(b) b.innerHTML=Object.keys(pess).slice(-80).map(function(x){ return '<option value="'+esc(x)+'">'; }).join('');
}
function syncRapido(){
  var f=document.getElementById('form-rapido'); if(!f) return;
  var rec = f.querySelector('[name=tipo]:checked').value==='receita';
  var quit = f.querySelector('[name=quitado]').checked;
  f.classList.toggle('is-receita', rec);
  document.getElementById('rapido-cats').hidden = rec;
  document.getElementById('rapido-quitado-label').textContent = rec ? 'Já foi recebido' : 'Já foi pago';
  document.getElementById('rapido-pessoa-label').textContent = rec ? 'Quem pagou (cliente)' : 'Fornecedor / quem recebeu';
  var recorr = f.querySelector('[name=recorrente]').checked;
  document.getElementById('rapido-data-label').textContent = recorr ? 'Começa em' : (quit ? 'Data' : 'Vencimento');
  var qh=document.getElementById('rapido-quitado-hint');
  qh.hidden = quit || recorr; qh.textContent = 'Vai para contas a '+(rec?'receber':'pagar')+' com o vencimento informado.';
  syncRecorrencia(f, 'data', quit?'quitado':'conta', parseValor(f.querySelector('[name=valor]').value), rec);
}
function onSubmitRapido(e){
  e.preventDefault();
  var f=e.target, fd=new FormData(f), modo=(e.submitter&&e.submitter.value)||'fechar';
  var valor=parseValor(fd.get('valor'));
  if(valor<=0){ toast('Informe um valor maior que zero.'); f.querySelector('[name=valor]').focus(); return; }
  var o=obraById(fd.get('obra'))||currentObra(); if(!o) return;
  var rec = fd.get('tipo')==='receita', cat = rec ? 'receita' : (fd.get('categoria')||'materiais');
  var desc=(fd.get('descricao')||'').trim()||'Lançamento', pessoa=(fd.get('pessoa')||'').trim(), data=fd.get('data')||hojeISO();
  var recr=lerRecorrencia(f);
  if(recr && recr.erro){ toast(recr.erro); return; }
  if(recr){
    gerarRecorrencia(o, {tipo:rec?'receita':'despesa', descricao:desc, categoria:cat, pessoa:pessoa, valor:valor}, recr, data, fd.get('quitado')?'quitado':'conta');
  }else if(fd.get('quitado')){
    o.ledger = o.ledger||[];
    o.ledger.push({id:uid('lan'), discriminacao:desc, categoria:cat, pagador:pessoa, data:data, receita:rec?valor:0, despesa:rec?0:valor});
    toast((rec?'Receita':'Despesa')+' de '+fmtBRL(valor)+' lançada em '+o.nomeDono+'.');
  }else{
    criarContas(o, {tipo:rec?'receber':'pagar', descricao:desc, pessoa:pessoa, categoria:cat, valor:valor, vencimento:data, obs:''}, 1);
    toast('Conta a '+(rec?'receber':'pagar')+' registrada.');
  }
  schedulePersist();
  if(modo==='outro'){
    quickCtx.pendingRender=true;
    f.querySelector('[name=valor]').value=''; f.querySelector('[name=descricao]').value=''; f.querySelector('[name=pessoa]').value='';
    preencherSugestoes(); f.querySelector('[name=valor]').focus();
  }else{
    document.getElementById('dlg-rapido').close(); render();
  }
}
function criarContas(o, base, n){
  var grupo = n>1 ? uid('grp') : null;
  for(var i=0;i<n;i++){
    contasDe(o).push({id:uid('cta'), tipo:base.tipo, descricao: base.descricao+(n>1?' ('+(i+1)+'/'+n+')':''), pessoa:base.pessoa,
      categoria:base.categoria, valor:base.valor, vencimento: i ? addMeses(base.vencimento,i) : base.vencimento,
      status:'aberto', obs:base.obs||'', grupo:grupo, criadoEm:new Date().toISOString()});
  }
}

/* ---------- contas: criar, editar, baixar ---------- */
function openConta(tipo, id, obraId, venc){
  var d=document.getElementById('dlg-conta'); if(!d) return;
  var f=document.getElementById('form-conta'); f.reset();
  contaCtx.editId=id||null; contaCtx.tipo=tipo; contaCtx.obraId=obraId||STATE.selectedObraId;
  var c = id ? (contasDe(obraById(obraId)).find(function(x){ return x.id===id; })) : null;
  if(c) { tipo=c.tipo; contaCtx.tipo=tipo; }
  var rec = tipo==='receber';
  document.getElementById('conta-titulo').textContent = (c?'Editar conta a ':'Nova conta a ')+(rec?'receber':'pagar');
  document.getElementById('conta-pessoa-label').textContent = rec ? 'Cliente / quem vai pagar' : 'Fornecedor';
  document.getElementById('conta-cat-field').hidden = rec;
  document.getElementById('conta-parcelas').hidden = !!c;
  document.getElementById('conta-obra-slot').innerHTML = c ? '' : obraSelectHtml('obra', contaCtx.obraId);
  if(c){
    f.descricao.value=c.descricao; f.pessoa.value=c.pessoa||''; f.categoria.value=DESP_CATS.indexOf(c.categoria)>=0?c.categoria:'materiais';
    f.valor.value=fmtValorInput(c.valor); f.vencimento.value=c.vencimento; f.obs.value=c.obs||'';
  }else{ f.vencimento.value = venc || hojeISO(); }
  var rd=f.querySelector('[name=rec_dia]'); if(rd) delete rd.dataset.mexido;
  syncRecorrencia(f, 'vencimento', 'conta', 0, tipo==='receber');
  d.showModal();
}
function onSubmitConta(e){
  e.preventDefault();
  var f=e.target, fd=new FormData(f), valor=parseValor(fd.get('valor'));
  if(valor<=0){ toast('Informe um valor maior que zero.'); return; }
  var rec = contaCtx.tipo==='receber';
  var dados={tipo:contaCtx.tipo, descricao:(fd.get('descricao')||'').trim(), pessoa:(fd.get('pessoa')||'').trim(),
    categoria: rec?'receita':(fd.get('categoria')||'materiais'), valor:valor, vencimento:fd.get('vencimento'), obs:(fd.get('obs')||'').trim()};
  if(contaCtx.editId){
    var o=obraById(contaCtx.obraId), c=contasDe(o).find(function(x){ return x.id===contaCtx.editId; });
    if(c){ Object.assign(c, dados); if(c.status==='pago') atualizarLancamentoDaConta(o,c); }
    toast('Conta atualizada.');
  }else{
    var o2=obraById(fd.get('obra'))||obraById(contaCtx.obraId)||currentObra(), recr=lerRecorrencia(f);
    if(recr && recr.erro){ toast(recr.erro); return; }
    if(recr) gerarRecorrencia(o2, {tipo:rec?'receita':'despesa', descricao:dados.descricao, categoria:dados.categoria, pessoa:dados.pessoa, valor:valor, obs:dados.obs}, recr, dados.vencimento, 'conta');
    else { criarContas(o2, dados, 1); toast('Conta registrada.'); }
  }
  document.getElementById('dlg-conta').close(); render(); schedulePersist();
}
function atualizarLancamentoDaConta(o,c){
  var l=(o.ledger||[]).find(function(x){ return x.id===c.lancamentoId; }); if(!l) return;
  l.discriminacao=c.descricao; l.categoria=c.categoria; l.pagador=c.pessoa||'';
}
function openBaixa(obraId, id){
  var o=obraById(obraId), c=contasDe(o).find(function(x){ return x.id===id; }); if(!c) return;
  contaCtx.baixaId=id; contaCtx.baixaObraId=obraId;
  var f=document.getElementById('form-baixa'); f.reset();
  var rec=c.tipo==='receber';
  document.getElementById('baixa-titulo').textContent = rec ? 'Confirmar recebimento' : 'Confirmar pagamento';
  document.getElementById('baixa-data-label').textContent = rec ? 'Data do recebimento' : 'Data do pagamento';
  document.getElementById('baixa-desc').innerHTML = '<b>'+esc(c.descricao)+'</b>'+(c.pessoa?' · '+esc(c.pessoa):'')+'<br>Vencimento '+fmtDate(c.vencimento)+(STATE.obras.length>1?' · '+esc(o.nomeDono):'');
  f.data.value=hojeISO(); f.valor.value=fmtValorInput(c.valor);
  document.getElementById('dlg-baixa').showModal();
}
function onSubmitBaixa(e){
  e.preventDefault();
  var fd=new FormData(e.target), o=obraById(contaCtx.baixaObraId), c=contasDe(o).find(function(x){ return x.id===contaCtx.baixaId; });
  if(!c) return;
  var valor=parseValor(fd.get('valor')); if(valor<=0){ toast('Informe o valor.'); return; }
  var rec=c.tipo==='receber', lid=uid('lan');
  o.ledger=o.ledger||[];
  o.ledger.push({id:lid, discriminacao:c.descricao, categoria:c.categoria, pagador:c.pessoa||'', data:fd.get('data'), receita:rec?valor:0, despesa:rec?0:valor, contaId:c.id});
  c.status='pago'; c.pagoEm=fd.get('data'); c.valorPago=valor; c.lancamentoId=lid;
  document.getElementById('dlg-baixa').close(); render(); schedulePersist();
  toast((rec?'Recebimento':'Pagamento')+' registrado e lançado no extrato.');
}
function estornarConta(obraId, id){
  var o=obraById(obraId), c=contasDe(o).find(function(x){ return x.id===id; }); if(!c) return;
  if(!confirm('Desfazer a baixa de "'+c.descricao+'"? O lançamento correspondente sai do extrato.')) return;
  o.ledger=(o.ledger||[]).filter(function(l){ return l.id!==c.lancamentoId; });
  c.status='aberto'; delete c.pagoEm; delete c.valorPago; delete c.lancamentoId;
  render(); schedulePersist(); toast('Baixa desfeita.');
}
function excluirConta(obraId, id){
  var o=obraById(obraId), c=contasDe(o).find(function(x){ return x.id===id; }); if(!c) return;
  var irmas = c.grupo ? contasDe(o).filter(function(x){ return x.grupo===c.grupo && x.status!=='pago' && x.id!==c.id; }) : [];
  var todas=false;
  if(irmas.length) todas = confirm('Esta conta faz parte de '+(c.recorrente?'uma recorrência mensal':'um parcelamento')+'.\n\nOK = excluir também as outras '+irmas.length+' em aberto\nCancelar = excluir só esta');
  else if(!confirm('Excluir a conta "'+c.descricao+'"?'+(c.status==='pago'?' O lançamento no extrato será mantido.':''))) return;
  o.contas = contasDe(o).filter(function(x){ return x.id!==c.id && !(todas && x.grupo===c.grupo && x.status!=='pago'); });
  render(); schedulePersist(); toast('Conta excluída.');
}

/* ---------- aba Contas ---------- */
function filtroObraHtml(){
  if(STATE.obras.length<2) return '';
  return '<select class="fin-obra" data-action="fin-obra" aria-label="Obra"><option value="atual"'+(FIN.obra==='atual'?' selected':'')+'>Só esta obra</option><option value="todas"'+(FIN.obra==='todas'?' selected':'')+'>Todas as obras</option></select>';
}
function renderContas(){
  var tipo=FIN.tipo, rec=tipo==='receber', hoje=hojeISO(), mes=hoje.slice(0,7);
  var todas=listaContas(tipo);
  var aberto=0, vencido=0, nVenc=0, semana=0, pagoMes=0;
  todas.forEach(function(x){ var c=x.c, s=situacao(c);
    if(c.status==='pago'){ if((c.pagoEm||'').slice(0,7)===mes) pagoMes+=c.valorPago||c.valor; return; }
    aberto+=c.valor; if(s.k==='vencida'){ vencido+=c.valor; nVenc++; } if(s.k==='hoje'||s.k==='semana') semana+=c.valor; });
  var linhas=todas.filter(function(x){ var s=situacao(x.c);
    if(FIN.status==='aberto') return s.k!=='pago'; if(FIN.status==='vencida') return s.k==='vencida'; if(FIN.status==='pago') return s.k==='pago'; return true; });
  linhas.sort(function(a,b){ if(FIN.status==='pago') return (b.c.pagoEm||'')<(a.c.pagoEm||'')?-1:1; return a.c.vencimento<b.c.vencimento?-1:(a.c.vencimento>b.c.vencimento?1:0); });
  var multi = FIN.obra==='todas' && STATE.obras.length>1;
  var total=0;
  var body=linhas.map(function(x){ var c=x.c, s=situacao(c); total+=c.status==='pago'?(c.valorPago||c.valor):c.valor;
    return '<tr class="'+(s.k==='vencida'?'row-vencida':'')+'"><td class="nowrap">'+fmtDate(c.vencimento)+'</td>' +
      '<td><b>'+esc(c.descricao)+'</b>'+tagRec(c)+(c.obs?'<div class="muted-sm">'+esc(c.obs)+'</div>':'')+'</td><td>'+esc(c.pessoa||'—')+'</td>' +
      (multi?'<td>'+esc(x.o.nomeDono)+'</td>':'') +
      (rec?'':'<td><span class="cat-pill"><span class="cat-dot" style="background:'+catColor(c.categoria)+'"></span>'+catLabel(c.categoria)+'</span></td>') +
      '<td class="num">'+fmtBRL(c.status==='pago'?(c.valorPago||c.valor):c.valor)+'</td><td><span class="badge '+s.cls+'">'+s.label+'</span></td>' +
      '<td class="row-actions nowrap">' + acoesConta(x.o, c) + '</td></tr>';
  }).join('') || '<tr><td colspan="9" class="empty-state">'+msgVazio()+'</td></tr>';
  var kpis = [
    ['Em aberto', fmtBRL(aberto), ''],
    [rec?'Atrasado':'Vencido', fmtBRL(vencido), nVenc+' conta'+(nVenc===1?'':'s'), vencido>0?'critical':''],
    ['Vence em 7 dias', fmtBRL(semana), ''],
    [(rec?'Recebido':'Pago')+' em '+MESES_LONGOS[parseInt(mes.slice(5),10)-1].toLowerCase(), fmtBRL(pagoMes), '', 'good']
  ].map(function(k){ return '<div class="kpi-tile"><div class="kpi-label">'+k[0]+'</div><div class="kpi-value'+(k[3]?' '+k[3]:'')+'">'+k[1]+'</div>'+(k[2]?'<div class="kpi-sub">'+k[2]+'</div>':'')+'</div>'; }).join('');
  var statusChips=[['aberto','Em aberto'],['vencida',rec?'Atrasadas':'Vencidas'],['pago',rec?'Recebidas':'Pagas'],['todas','Todas']].map(function(s){
    return '<button class="fchip'+(FIN.status===s[0]?' on':'')+'" data-action="fin-status" data-v="'+s[0]+'">'+s[1]+'</button>'; }).join('');
  return '<div class="toolbar"><div><div class="section-title">Contas a pagar e a receber</div><div class="section-desc" style="margin-bottom:0;">Ao dar baixa, a conta entra automaticamente no extrato de lançamentos.</div></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn" data-action="new-conta" data-tipo="receber">+ Conta a receber</button><button class="btn btn-accent" data-action="new-conta" data-tipo="pagar">+ Conta a pagar</button></div></div>' +
    '<div class="fin-filtros"><div class="seg seg-sm"><button class="'+(!rec?'on':'')+'" data-action="fin-tipo" data-v="pagar">A pagar</button><button class="'+(rec?'on':'')+'" data-action="fin-tipo" data-v="receber">A receber</button></div>' +
      '<div class="fchips">'+statusChips+'</div>'+filtroObraHtml()+'</div>' +
    '<div class="grid grid-kpi fin-kpis">'+kpis+'</div>' +
    '<div class="card"><div class="table-wrap"><table><thead><tr><th>Vencimento</th><th>Descrição</th><th>'+(rec?'Cliente':'Fornecedor')+'</th>'+(multi?'<th>Obra</th>':'')+(rec?'':'<th>Categoria</th>')+'<th class="num">Valor</th><th>Situação</th><th></th></tr></thead><tbody>'+body+'</tbody>' +
      (linhas.length?'<tfoot><tr><td colspan="'+(3+(multi?1:0)+(rec?0:1))+'" style="font-weight:700">Total ('+linhas.length+')</td><td class="num" style="font-weight:700">'+fmtBRL(total)+'</td><td colspan="2"></td></tr></tfoot>':'') +
    '</table></div></div>';
}
function tagRec(c){ return c.recorrente ? ' <span class="tag-rec" title="Recorrente: todo dia '+c.recorrente.dia+' por '+c.recorrente.meses+' meses">&#8635; mensal</span>' : ''; }
function msgVazio(){
  if(FIN.status==='vencida') return 'Nenhuma conta '+(FIN.tipo==='pagar'?'vencida':'atrasada')+'.';
  if(FIN.status==='pago') return 'Nenhuma conta '+(FIN.tipo==='pagar'?'paga':'recebida')+' ainda.';
  return 'Nenhuma conta a '+(FIN.tipo==='pagar'?'pagar':'receber')+' em aberto. Use o botão acima para registrar.';
}
function acoesConta(o, c){
  var a=' data-obra="'+esc(o.id)+'" data-id="'+esc(c.id)+'"';
  if(c.status==='pago') return '<button class="btn btn-sm" data-action="unpay-conta"'+a+'>Desfazer baixa</button>' +
    '<button class="btn btn-sm btn-icon" data-action="delete-conta"'+a+' title="Excluir">&times;</button>';
  return '<button class="btn btn-sm btn-pay" data-action="pay-conta"'+a+'>'+(c.tipo==='pagar'?'Pagar':'Receber')+'</button>' +
    '<button class="btn btn-sm btn-icon" data-action="edit-conta"'+a+' title="Editar">&#9998;</button>' +
    '<button class="btn btn-sm btn-icon" data-action="delete-conta"'+a+' title="Excluir">&times;</button>';
}

/* ---------- aba Calendário ---------- */
function renderCalendario(){
  var hoje=hojeISO();
  if(!FIN.calMes) FIN.calMes=hoje.slice(0,7);
  var ym=FIN.calMes, y=+ym.slice(0,4), m=+ym.slice(5)-1;
  if(!FIN.calDia || FIN.calDia.slice(0,7)!==ym) FIN.calDia = hoje.slice(0,7)===ym ? hoje : null;
  var contas=listaContas(FIN.calTipo).filter(function(x){ return (x.c.vencimento||'').slice(0,7)===ym; });
  var porDia={}; contas.forEach(function(x){ (porDia[x.c.vencimento]=porDia[x.c.vencimento]||[]).push(x); });
  var tot=0, pago=0, aberto=0, venc=0;
  contas.forEach(function(x){ var c=x.c; tot+=c.valor; if(c.status==='pago') pago+=(c.valorPago||c.valor); else { aberto+=c.valor; if(c.vencimento<hoje) venc+=c.valor; } });
  var primeiro=new Date(y,m,1).getDay(), dias=new Date(y,m+1,0).getDate(), cells='';
  for(var i=0;i<primeiro;i++) cells+='<div class="cal-cell vazio"></div>';
  for(var d=1; d<=dias; d++){
    var iso=ym+'-'+String(d).padStart(2,'0'), lista=porDia[iso]||[], cls='cal-cell';
    if(iso===hoje) cls+=' hoje'; if(iso===FIN.calDia) cls+=' sel';
    var info='';
    if(lista.length){
      var abertas=lista.filter(function(x){ return x.c.status!=='pago'; });
      var est = !abertas.length ? 'ok' : (iso<hoje ? 'atraso' : 'aberto');
      var soma=lista.reduce(function(s,x){ return s+(x.c.status==='pago'?0:x.c.valor); },0);
      cls+=' tem '+est;
      info='<span class="cal-val">'+(abertas.length?fmtBRL(soma).replace('R$','').trim():'pago')+'</span><span class="cal-qtd">'+lista.length+' conta'+(lista.length>1?'s':'')+'</span>';
    }
    cells+='<button class="'+cls+'" data-action="cal-dia" data-dia="'+iso+'" aria-label="'+d+' de '+MESES_LONGOS[m]+(lista.length?', '+lista.length+' contas':'')+'"><span class="cal-num">'+d+'</span>'+info+'</button>';
  }
  var dow=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(function(x){ return '<div class="cal-dow">'+x+'</div>'; }).join('');
  var tipoBtns=[['pagar','A pagar'],['receber','A receber'],['ambos','Ambos']].map(function(t){ return '<button class="'+(FIN.calTipo===t[0]?'on':'')+'" data-action="cal-tipo" data-v="'+t[0]+'">'+t[1]+'</button>'; }).join('');
  var rotulo = FIN.calTipo==='receber' ? ['A receber no mês','Recebido','Em aberto','Atrasado'] : ['Total do mês','Pago','Em aberto','Vencido'];
  var resumo='<div class="cal-resumo"><div><span>'+rotulo[0]+'</span><b>'+fmtBRL(tot)+'</b></div><div><span>'+rotulo[1]+'</span><b class="text-good">'+fmtBRL(pago)+'</b></div><div><span>'+rotulo[2]+'</span><b>'+fmtBRL(aberto)+'</b></div><div><span>'+rotulo[3]+'</span><b class="'+(venc?'text-crit':'')+'">'+fmtBRL(venc)+'</b></div></div>';
  return '<div class="toolbar"><div><div class="section-title">Calendário de contas</div><div class="section-desc" style="margin-bottom:0;">Clique num dia para ver as contas que vencem nele.</div></div>' +
      '<div class="fin-filtros" style="margin:0"><div class="seg seg-sm">'+tipoBtns+'</div>'+filtroObraHtml()+'</div></div>' +
    '<div class="cal-layout"><div class="card cal-card">' +
      '<div class="cal-head"><button class="btn btn-icon" data-action="cal-nav" data-v="-1" aria-label="Mês anterior">&#8249;</button><h3>'+MESES_LONGOS[m]+' '+y+'</h3><button class="btn btn-icon" data-action="cal-nav" data-v="1" aria-label="Próximo mês">&#8250;</button>' +
        (hoje.slice(0,7)!==ym?'<button class="btn btn-sm" data-action="cal-nav" data-v="0">Hoje</button>':'')+'</div>' +
      resumo + '<div class="cal-grid">'+dow+cells+'</div>' +

function updateResend(){
  var r=document.getElementById('auth-resend'); if(!r){ clearInterval(resendTimer); return; }
  var left=Math.ceil((resendUntil-Date.now())/1000);

  else { r.disabled=false; r.textContent='Reenviar código'; clearInterval(resendTimer); }
}

}

function checkNewPass(){

function traduzErro(err){
  var m=String(err && err.message || err);
  if(/Invalid login/i.test(m)) return 'E-mail ou senha incorretos.';
  if(/already registered|already been registered/i.test(m)) return 'Este e-mail já tem conta. Use "Entrar" ou "Esqueci a senha".';
  if(/Email not confirmed/i.test(m)) return 'E-mail ainda não confirmado. Crie a conta de novo para receber outro código.';
  if(/expired|invalid.*(otp|token)|token.*(expired|invalid)/i.test(m)) return 'Código inválido ou expirado. Peça um novo.';
  if(/rate limit|too many|security purposes/i.test(m)) return 'Muitas tentativas. Aguarde um minuto e tente de novo.';
  if(/should be different/i.test(m)) return 'A nova senha precisa ser diferente da anterior.';
  if(/duplicate key|unique/i.test(m)) return 'Este e-mail já faz parte da construtora.';
  if(/row-level security|permission denied/i.test(m)) return 'Você não tem permissão para isso.';
  if(/function .* does not exist|relation .* does not exist|Could not find/i.test(m)) return 'O banco de dados ainda não foi preparado. Rode o script SQL no Supabase.';
  if(/Failed to fetch|NetworkError/i.test(m)) return 'Sem conexão com a internet.';
  if(/password/i.test(m) && /weak|short|characters|pwned|leaked/i.test(m)) return 'Senha fraca ou já vazada na internet. Escolha outra.';
  if(/limite de construtoras/i.test(m)) return 'Limite de construtoras por conta atingido.';
  if(/Nome muito longo/.test(m)) return m;
  if(/só o administrador pode pagar/i.test(m)) return 'Só o administrador da construtora pode pagar a mensalidade.';
  if(/administrador ativo/i.test(m)) return 'A construtora precisa ter pelo menos um administrador ativo.';
  if(/whatsapp_formato/i.test(m)) return 'WhatsApp inválido. Use DDD + número.';
  if(/CNPJ já cadastrado/i.test(m)) return 'Este CNPJ já tem uma construtora no painel. Peça ao administrador dela um convite pelo seu e-mail.';
  if(/CNPJ inválido/i.test(m)) return 'CNPJ inválido. Confira os números.';
  if(/CNPJ baixado/i.test(m)) return 'Este CNPJ está baixado ou nulo na Receita Federal e não pode ser cadastrado.';
  if(/não pode ser trocado/i.test(m)) return 'O CNPJ da construtora não pode ser trocado.';
  if(/razão social obrigatória/i.test(m)) return 'Informe a razão social.';
  if(/e-mail não confirmado/i.test(m)) return 'Confirme o e-mail antes de cadastrar a construtora.';
  if(window.console) console.warn(err);
  return 'Não foi possível concluir. Tente novamente em instantes.';
}

async function resendCode(){
  try{
    if(authView==='signup-code'){ var r=await supabaseClient.auth.resend({type:'signup', email:authEmail}); if(r.error) throw r.error; }
    else { var r2=await supabaseClient.auth.resetPasswordForEmail(authEmail); if(r2.error) throw r2.error; }
    startResendCooldown(); authMsg('Novo código enviado.', true);
  }catch(err){ authMsg(traduzErro(err)); }
}

async function submitAuth(){
  if(authView==='assinatura'){ return gerarLinkBloqueado(); }
  var btn=document.getElementById('auth-btn'); if(!btn) return;
  var v=authView, idEl=document.getElementById('auth-id'), email=val('auth-id').trim(), senha=val('auth-pass'), code=val('auth-code').trim(), erro;
  if(idEl && !idEl.readOnly){
    if(!email) return authMsg('Informe o e-mail.');
    if(!emailOk(email)) return authMsg('E-mail inválido.');
    authEmail=email;
  }
  if(v==='login' && !senha) return authMsg('Informe a senha.');
  if((v==='signup'||v==='reset-code'||v==='set-password') && (erro=checkNewPass())) return authMsg(erro);
  if((v==='signup-code'||v==='reset-code') && code.length<6) return authMsg('Digite o código completo.');
  var sel=null; if(v==='nova-construtora'){ sel=cnpjSelecionado('auth'); if(typeof sel==='string') return authMsg(sel); }
  btn.disabled=true; authMsg('');
  try{
    if(v==='nova-construtora') return await criarConstrutora(sel);
    if(!supabaseReady) return authMsg(configErro);
    {
      if(v==='login'){
        var r=await supabaseClient.auth.signInWithPassword({email:email, password:senha}); if(r.error) throw r.error;
        return await afterLogin(r.data.user);
      }
      if(v==='signup'){
        var r1=await supabaseClient.auth.signUp({email:email, password:senha, options:{data:{senha_definida:true}, emailRedirectTo:appUrl()}}); if(r1.error) throw r1.error;
        if(r1.data.session) return await afterLogin(r1.data.user);
        if(r1.data.user && r1.data.user.identities && r1.data.user.identities.length===0)
          return goView('login', {t:'Este e-mail já tem conta. Entre ou use "Esqueci a senha".'});
        startResendCooldown(); return goView('signup-code', {t:'Código enviado. Confira também a caixa de spam.', ok:true});
      }
      if(v==='signup-code'){
        var r2=await supabaseClient.auth.verifyOtp({email:authEmail, token:code, type:'signup'}); if(r2.error) throw r2.error;
        return await afterLogin(r2.data.user);
      }
      if(v==='forgot'){
        var r3=await supabaseClient.auth.resetPasswordForEmail(email); if(r3.error) throw r3.error;
        startResendCooldown(); return goView('reset-code', {t:'Se o e-mail estiver cadastrado, o código chega em instantes.', ok:true});
      }
      if(v==='reset-code'){
        var r4=await supabaseClient.auth.verifyOtp({email:authEmail, token:code, type:'recovery'}); if(r4.error) throw r4.error;
        var r5=await supabaseClient.auth.updateUser({password:senha, data:{senha_definida:true}}); if(r5.error) throw r5.error;
        return await afterLogin(r5.data.user);
      }
      if(v==='set-password'){
        var r6=await supabaseClient.auth.updateUser({password:senha, data:{senha_definida:true}}); if(r6.error) throw r6.error;
        return await afterLogin(r6.data.user);
      }
    }
  }catch(err){
    authMsg(traduzErro(err));
  }finally{ var b=document.getElementById('auth-btn'); if(b) b.disabled=false; }
}

/* Depois de autenticado: descobre a construtora e o papel */
async function afterLogin(user){
  AUTH_USER = user.email;
  var r = await supabaseClient.rpc('meu_acesso');
  if(r.error) throw r.error;
  var todos = r.data || [];
  var lista = todos.filter(function(x){ return x.ativo !== false; });
  var esc1 = lista.filter(function(x){ return x.assinatura_ok !== false; })[0] || lista[0];
  CTX = esc1 ? {cid:esc1.construtora_id, nome:esc1.nome, papel:['admin','editor','leitor'].indexOf(esc1.papel)>=0?esc1.papel:'leitor', situacao:String(esc1.assinatura_situacao||'')} : null;
  try{ var d = await supabaseClient.rpc('eh_dono'); EH_DONO = !d.error && d.data===true; }catch(e){ EH_DONO=false; }
  if(!CTX && todos.length){ INATIVO_EM = todos[0].nome || ''; authView='inativo'; return renderAuth(); }
  var meta = user.user_metadata || {};
  if(CTX && !meta.senha_definida){ authView='set-password'; return renderAuth(); }
  if(!CTX){ authView='nova-construtora'; return renderAuth(); }
  if(esc1.assinatura_ok === false){ ASSIN_BLOQ = {situacao:CTX.situacao, link:null}; authView='assinatura'; return renderAuth(); }
  ASSIN_BLOQ = null;
  startApp();
}

async function criarConstrutora(sel){

  CTX = {cid:r.data, nome:nomeExibicao(sel.dados), papel:'admin'};
  STATE = estadoVazio();
  appStarted = true;
  try{ render(); }catch(e){}

function startApp(){
