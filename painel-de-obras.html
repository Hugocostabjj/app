<style>
:root{
  color-scheme:light;
  --bg-page:#f2f1ec; --bg-surface:#fdfdfb; --bg-surface-2:#f6f5f0; --bg-raised:#ffffff;
  --ink-primary:#14181c; --ink-secondary:#545c62; --ink-muted:#8a9198;
  --border:rgba(20,24,28,0.12); --border-strong:rgba(20,24,28,0.24);
  --accent:#eb6834; --accent-ink:#ffffff; --accent-soft:#fce3d4;
  --structural:#1c3a5e; --structural-2:#26496e; --structural-ink:#eef3f8;
  --good:#0ca30c; --good-soft:#e2f5df; --warning:#b8790a; --warning-soft:#fdecc8;
  --serious:#c65a34; --critical:#d03b3b; --critical-soft:#fbe2e0;
  --cat-lote:#2a78d6; --cat-mao:#eb6834; --cat-quent:#1baf7a; --cat-mat:#eda100; --cat-corr:#e87ba4; --cat-outros:#4a3aa7;
  --cat-receita:#2a78d6; --cat-despesa:#e34948;
  --shadow-sm:0 1px 2px rgba(20,24,28,0.07);
  --shadow-md:0 4px 18px rgba(20,24,28,0.08);
  --radius-sm:8px; --radius-md:12px; --radius-lg:20px;
  --font-display:'Archivo',ui-sans-serif,system-ui,sans-serif;
  --font-body:'Public Sans',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg-page:#101314; --bg-surface:#1a1e21; --bg-surface-2:#20252a; --bg-raised:#22282d;
    --ink-primary:#f5f6f4; --ink-secondary:#c3c2b7; --ink-muted:#8f968c;
    --border:rgba(255,255,255,0.10); --border-strong:rgba(255,255,255,0.20);
    --accent:#e7742f; --accent-ink:#ffffff; --accent-soft:#3a2416;
    --structural:#24425f; --structural-2:#2f5478; --structural-ink:#eef3f8;
    --good:#39c239; --good-soft:#123018; --warning:#e0a83a; --warning-soft:#3a2d0f;
    --serious:#e0895f; --critical:#e66767; --critical-soft:#3a1a18;
    --cat-lote:#3987e5; --cat-mao:#e7742f; --cat-quent:#199e70; --cat-mat:#c98500; --cat-corr:#d55181; --cat-outros:#9085e9;
    --cat-receita:#3987e5; --cat-despesa:#e66767;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.5);
    --shadow-md:0 6px 24px rgba(0,0,0,0.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg-page:#101314; --bg-surface:#1a1e21; --bg-surface-2:#20252a; --bg-raised:#22282d;
  --ink-primary:#f5f6f4; --ink-secondary:#c3c2b7; --ink-muted:#8f968c;
  --border:rgba(255,255,255,0.10); --border-strong:rgba(255,255,255,0.20);
  --accent:#e7742f; --accent-ink:#ffffff; --accent-soft:#3a2416;
  --structural:#24425f; --structural-2:#2f5478; --structural-ink:#eef3f8;
  --good:#39c239; --good-soft:#123018; --warning:#e0a83a; --warning-soft:#3a2d0f;
  --serious:#e0895f; --critical:#e66767; --critical-soft:#3a1a18;
  --cat-lote:#3987e5; --cat-mao:#e7742f; --cat-quent:#199e70; --cat-mat:#c98500; --cat-corr:#d55181; --cat-outros:#9085e9;
  --cat-receita:#3987e5; --cat-despesa:#e66767;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.5);
  --shadow-md:0 6px 24px rgba(0,0,0,0.45);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-page); color:var(--ink-primary); font-family:var(--font-body);
  font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); text-wrap:balance; margin:0; letter-spacing:-0.01em;}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit;}
button{cursor:pointer;}
a{color:var(--cat-lote);}
.mono{font-family:var(--font-mono);}
.tabular{font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{height:10px;width:10px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}

/* ---------- layout shell ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  background:linear-gradient(180deg,var(--structural),var(--structural-2));
  color:var(--structural-ink); box-shadow:var(--shadow-md);
}
.topbar-inner{
  max-width:1240px; margin:0 auto; padding:14px 20px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:10px; margin-right:auto;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-family:var(--font-display);font-weight:800;color:var(--accent-ink);font-size:16px;
}
.brand-text h1{font-size:17px;color:#fff;}
.brand-text span{font-size:11.5px;color:rgba(238,243,248,0.72);letter-spacing:0.02em;}
.obra-switch{display:flex;align-items:center;gap:8px;}
.obra-switch select{
  background:rgba(255,255,255,0.10); border:1px solid rgba(255,255,255,0.22); color:#fff;
  padding:8px 10px; border-radius:8px; max-width:220px;
}
.obra-switch select option{color:#111;}
.btn{
  border:1px solid var(--border-strong); background:var(--bg-surface); color:var(--ink-primary);
  padding:8px 13px; border-radius:9px; font-weight:600; font-size:13px; display:inline-flex; gap:6px; align-items:center;
  transition:filter .12s ease, transform .12s ease;
}
.btn:hover{filter:brightness(0.97);}
.btn:active{transform:translateY(1px);}
.btn-accent{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.btn-ghost-dark{background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.24); color:#fff;}
.btn-ghost-dark:hover{background:rgba(255,255,255,0.16);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px;}
.btn-danger{color:var(--critical); border-color:var(--critical-soft); background:var(--critical-soft);}
.btn-icon{width:32px;height:32px;padding:0;justify-content:center;border-radius:8px;}
.save-status{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(238,243,248,0.75);}
.save-dot{width:7px;height:7px;border-radius:50%;background:var(--good);}
.save-dot.busy{background:var(--warning);}
.save-dot.off{background:var(--ink-muted);}

.shell{max-width:1240px;margin:0 auto;padding:20px 20px 64px;}
.obra-card{
  background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:18px 22px; box-shadow:var(--shadow-sm); display:flex; justify-content:space-between; gap:18px;
  flex-wrap:wrap; margin-bottom:18px;
}
.obra-id h2{font-size:22px;}
.obra-meta{display:flex; gap:22px; flex-wrap:wrap; margin-top:8px;}
.obra-meta div{font-size:12.5px;color:var(--ink-secondary);}
.obra-meta strong{display:block;color:var(--ink-primary);font-weight:600;font-size:13.5px;}
.obra-actions{display:flex; align-items:flex-start; gap:8px;}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:20px; overflow-x:auto;}
.tab{
  padding:10px 16px; border:none; background:none; font-weight:600; color:var(--ink-secondary);
  border-bottom:2px solid transparent; white-space:nowrap; font-size:13.5px;
}
.tab.active{color:var(--accent); border-bottom-color:var(--accent);}
.tab:hover{color:var(--ink-primary);}

.grid{display:grid; gap:16px;}
.grid-kpi{grid-template-columns:repeat(auto-fit,minmax(168px,1fr));}
.grid-2{grid-template-columns:1.1fr 0.9fr;}
.grid-2b{grid-template-columns:1fr 1fr;}
@media (max-width:860px){.grid-2,.grid-2b{grid-template-columns:1fr;}}

.card{background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px 18px; box-shadow:var(--shadow-sm);}
.card h3{font-size:14px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
.card h3 .hint{font-size:11px; font-weight:500; color:var(--ink-muted);}

.kpi-tile{background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 16px; box-shadow:var(--shadow-sm);}
.kpi-label{font-size:11.5px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.04em; font-weight:600;}
.kpi-value{font-family:var(--font-display); font-size:22px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums;}
.kpi-sub{font-size:12px; color:var(--ink-secondary); margin-top:2px;}
.kpi-value.good{color:var(--good);} .kpi-value.critical{color:var(--critical);}

/* progress meters */
.meter-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border);}
.meter-row:last-child{border-bottom:none;}
.meter-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.meter-body{flex:1; min-width:0;}
.meter-top{display:flex; justify-content:space-between; gap:8px; font-size:12.5px; margin-bottom:5px;}
.meter-top b{font-weight:600;}
.meter-track{height:8px; background:var(--bg-surface-2); border-radius:5px; overflow:hidden; position:relative;}
.meter-fill{height:100%; border-radius:5px; transition:width .3s ease;}
.meter-nums{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-muted); margin-top:4px;}
.meter-pct{font-family:var(--font-mono); font-size:12px; font-weight:600; width:44px; text-align:right; flex-shrink:0;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;}
.badge-good{background:var(--good-soft);color:var(--good);}
.badge-warn{background:var(--warning-soft);color:var(--warning);}
.badge-muted{background:var(--bg-surface-2);color:var(--ink-muted);}
.badge-crit{background:var(--critical-soft);color:var(--critical);}

/* tables */
.table-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border-strong); white-space:nowrap;}
td{padding:9px 10px; border-bottom:1px solid var(--border); white-space:nowrap;}
tbody tr:hover{background:var(--bg-surface-2);}
td.num,th.num{text-align:right; font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
.text-good{color:var(--good);} .text-crit{color:var(--critical);} .text-muted{color:var(--ink-muted);}
.row-actions{display:flex;gap:4px;justify-content:flex-end;}
.cat-pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bg-surface-2);}
.cat-dot{width:7px;height:7px;border-radius:50%;}

/* forms & modals */
dialog{border:none;border-radius:var(--radius-lg);padding:0;max-width:520px;width:92vw;background:var(--bg-raised);color:var(--ink-primary);box-shadow:var(--shadow-md);}
dialog.modal-wide{max-width:920px;}
dialog::backdrop{background:rgba(10,12,14,0.55);}
.modal-head{padding:18px 22px 0;}
.modal-body{padding:16px 22px 22px;max-height:72vh;overflow-y:auto;}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-secondary);margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%; padding:9px 10px; border:1px solid var(--border-strong); border-radius:8px;
  background:var(--bg-surface); color:var(--ink-primary);
}
.field textarea{resize:vertical;min-height:60px;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.field-hint{font-size:11px;color:var(--ink-muted);margin-top:4px;}

/* day grid */
.quinzena-card{margin-bottom:16px;}
.qz-title-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.qz-title-row h4{font-size:14.5px;}
.daygrid-wrap{overflow-x:auto;}
.daygrid{border-collapse:collapse;font-size:12px;}
.daygrid th,.daygrid td{border:1px solid var(--border);padding:5px 7px;text-align:center;white-space:nowrap;}
.daygrid th{background:var(--bg-surface-2);font-size:10px;color:var(--ink-muted);font-weight:600;}
.daygrid td.name-cell{text-align:left;font-weight:600;min-width:150px;}
.daygrid td.cargo-cell{text-align:left;color:var(--ink-secondary);font-size:11px;min-width:100px;}
.code-cell{cursor:pointer;user-select:none;font-family:var(--font-mono);font-weight:600;border-radius:5px !important;min-width:30px;}
.code-cell:hover{outline:2px solid var(--accent);outline-offset:-2px;}
.code-D{background:var(--accent-soft);color:var(--serious);}
.code-C{background:#e4ecf7;color:var(--cat-lote);}
.code-M{background:var(--bg-surface-2);color:var(--ink-secondary);}
:root:not([data-theme="light"]) .code-C{background:#1c3450;color:#8fb6ec;}
:root[data-theme="dark"] .code-C{background:#1c3450;color:#8fb6ec;}
.editable-num{width:72px;padding:4px 6px;border:1px solid var(--border-strong);border-radius:6px;text-align:right;font-family:var(--font-mono);background:var(--bg-surface);}
.qz-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink-muted);margin-top:8px;}
.qz-summary{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;}
.qz-summary b{font-family:var(--font-mono);}

/* charts */
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-secondary);}
.legend-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.donut-center-label{font-size:11px;color:var(--ink-muted);}
.donut-center-value{font-family:var(--font-display);font-size:18px;font-weight:700;}
.bars-svg text{font-family:var(--font-mono);fill:var(--ink-muted);font-size:10px;}
.bars-svg .axis-line{stroke:var(--border-strong);stroke-width:1;}
.bars-svg .grid-line{stroke:var(--border);stroke-width:1;}

/* drive */
.drive-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.drive-item{border:1px solid var(--border);border-radius:var(--radius-md);padding:13px 14px;background:var(--bg-surface);}
.drive-item .cat{font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-muted);font-weight:600;}
.drive-item .fname{font-weight:600;margin:4px 0 8px;word-break:break-word;}
.drive-item img{max-width:100%;border-radius:8px;margin-bottom:8px;display:block;}
.drive-item .foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-muted);}
.empty-state{padding:36px 20px;text-align:center;color:var(--ink-muted);}
.empty-state .big{font-size:32px;margin-bottom:8px;}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.section-title{font-size:18px;margin-bottom:2px;}
.section-desc{font-size:12.5px;color:var(--ink-secondary);margin-bottom:16px;}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--structural);color:var(--structural-ink);padding:10px 18px;border-radius:10px;
  font-size:13px;box-shadow:var(--shadow-md);z-index:100;
}
.check-row{display:flex;align-items:center;gap:8px;}
.material-row.bought .mname{text-decoration:line-through;color:var(--ink-muted);}
select.small{width:auto;padding:6px 8px;font-size:12px;border-radius:7px;}

/* ---------- tela de acesso ---------- */
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--bg-page);}
.auth-hero{
  position:relative;overflow:hidden;color:var(--structural-ink);padding:48px 52px;display:flex;flex-direction:column;justify-content:space-between;
  background:
    linear-gradient(rgba(255,255,255,0.06) 1px,transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg,rgba(255,255,255,0.06) 1px,transparent 1px) 0 0/28px 28px,
    linear-gradient(160deg,var(--structural),#132a45);
}
.auth-hero::after{
  content:"";position:absolute;right:-60px;bottom:-60px;width:340px;height:340px;border:2px dashed rgba(235,104,52,0.45);border-radius:50%;pointer-events:none;
}
.auth-brand{display:flex;align-items:center;gap:12px;}
.auth-brand .brand-mark{width:42px;height:42px;font-size:19px;border-radius:11px;}
.auth-brand b{font-family:var(--font-display);font-size:15px;letter-spacing:0.01em;color:#fff;}
.auth-hero h2{font-size:clamp(34px,4.4vw,54px);line-height:1.02;color:#fff;font-weight:800;max-width:11ch;margin:40px 0 18px;}
.auth-hero h2 em{font-style:normal;color:var(--accent);}
.auth-hero p{max-width:40ch;color:rgba(238,243,248,0.78);font-size:15px;margin:0;}
.auth-specs{display:flex;gap:28px;flex-wrap:wrap;margin-top:36px;font-size:12.5px;color:rgba(238,243,248,0.7);}
.auth-specs strong{display:block;font-family:var(--font-display);font-size:15px;color:#fff;}
.auth-side{display:flex;align-items:center;justify-content:center;padding:40px 24px;}
.auth-card{width:100%;max-width:400px;}
.auth-card h3{font-size:26px;margin-bottom:6px;}
.auth-card .auth-sub{color:var(--ink-secondary);margin:0 0 26px;}
.auth-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.auth-field label{font-size:12.5px;font-weight:600;color:var(--ink-secondary);}
.auth-field input{
  padding:12px 14px;border-radius:10px;border:1px solid var(--border-strong);background:var(--bg-raised);font-size:15px;
}
.auth-field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.auth-pass{position:relative;}
.auth-pass input{width:100%;padding-right:70px;}
.auth-pass button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--ink-secondary);font-size:12px;font-weight:600;padding:6px 8px;}
.auth-check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-secondary);margin:4px 0 20px;}
.auth-submit{width:100%;justify-content:center;padding:13px;font-size:15px;border-radius:10px;}
.auth-submit[disabled]{opacity:.6;cursor:wait;}
.auth-msg{min-height:20px;font-size:13px;margin-top:14px;}
.auth-msg.err{color:var(--critical);} .auth-msg.ok{color:var(--good);}
.auth-switch{margin-top:22px;padding-top:18px;border-top:1px solid var(--border);font-size:13.5px;color:var(--ink-secondary);}
.auth-switch button{border:none;background:none;color:var(--accent);font-weight:700;padding:0;}
.auth-note{font-size:12px;color:var(--ink-muted);margin-top:16px;}
.auth-meter{height:4px;border-radius:4px;background:var(--border);margin-top:6px;overflow:hidden;}
.auth-meter i{display:block;height:100%;width:0;background:var(--critical);transition:width .2s,background .2s;}
.auth-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 20px;}
.auth-row .auth-check{margin:0;}
.auth-row .auth-link{margin-left:auto;}

.btn-inativar{color:var(--critical);border-color:var(--critical);}
.btn-reativar{color:var(--good);border-color:var(--good);}

/* ---------- lançamento rápido / contas / calendário ---------- */
.fab{position:fixed;right:max(20px, env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:8px;
  background:var(--accent);color:#fff;border:none;border-radius:999px;padding:14px 22px 14px 18px;font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(235,104,52,.35),0 2px 6px rgba(0,0,0,.15);}
.fab:hover{filter:brightness(1.05);} .fab-plus{font-size:24px;line-height:1;font-weight:700;}
.shell{padding-bottom:96px;}
.atalhos{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:12px;margin-bottom:18px;}
.atalho{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--bg-surface);border-radius:var(--radius-md);padding:14px 20px;font-weight:700;font-size:15px;color:var(--ink-primary);box-shadow:var(--shadow-sm);}
.atalho span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:700;color:#fff;}
.atalho-desp span{background:var(--critical);} .atalho-rec span{background:var(--good);}
.atalho:hover{border-color:var(--border-strong);}
.atalho-contas{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--border);background:var(--bg-surface);border-radius:var(--radius-md);padding:12px 16px;color:var(--ink-secondary);font-size:13.5px;box-shadow:var(--shadow-sm);}
.atalho-contas small{display:block;color:var(--accent);font-weight:700;font-size:12.5px;margin-top:2px;}
.atalho-contas b{color:var(--ink-primary);} .atalho-contas b.text-crit{color:var(--critical);}
.ac-ic{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex-shrink:0;}
dialog.sheet{max-width:480px;}
.sheet-head{display:flex;justify-content:space-between;align-items:center;}
.seg{display:flex;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:11px;padding:3px;gap:3px;margin-bottom:14px;}
.seg label,.seg button{flex:1;}
.seg input{position:absolute;opacity:0;pointer-events:none;}
.seg span,.seg button{display:block;text-align:center;padding:9px 12px;border-radius:8px;font-weight:700;font-size:14px;color:var(--ink-secondary);border:none;background:none;cursor:pointer;}
.seg input:checked + span{background:var(--critical);color:#fff;}
.is-receita .seg input:checked + span{background:var(--good);}
.seg input:focus-visible + span{outline:2px solid var(--accent);}
.seg button.on{background:var(--bg-raised);color:var(--ink-primary);box-shadow:var(--shadow-sm);}
.seg-sm{margin:0;display:inline-flex;} .seg-sm button{padding:7px 14px;font-size:13px;flex:none;}
.valor-wrap{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--critical);padding:4px 2px 6px;margin-bottom:16px;}
.is-receita .valor-wrap{border-bottom-color:var(--good);}
.valor-wrap span{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--ink-muted);}
.valor-grande{flex:1;border:none;background:none;font-family:var(--font-display);font-size:38px;font-weight:800;color:var(--ink-primary);width:100%;padding:0;font-variant-numeric:tabular-nums;}
.valor-grande:focus{outline:none;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip input{position:absolute;opacity:0;pointer-events:none;}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;border:1px solid var(--border-strong);font-size:13px;font-weight:600;cursor:pointer;background:var(--bg-surface);}
.chip span i{width:9px;height:9px;border-radius:50%;}
.chip input:checked + span{border-color:var(--ink-primary);background:var(--ink-primary);color:var(--bg-surface);}
.chip input:focus-visible + span{outline:2px solid var(--accent);}
.switch{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;margin:4px 0 12px;cursor:pointer;}
.switch input{position:absolute;opacity:0;}
.sw{width:42px;height:24px;border-radius:999px;background:var(--border-strong);position:relative;transition:background .15s;flex-shrink:0;}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;}
.switch input:checked + .sw{background:var(--good);} .switch input:checked + .sw::after{transform:translateX(18px);}
.switch input:focus-visible + .sw{outline:2px solid var(--accent);outline-offset:2px;}
.recorr-box{border-top:1px dashed var(--border-strong);padding-top:12px;margin-top:4px;}
.recorr-box .switch{margin:0;}
.recorr{margin-top:10px;background:var(--bg-surface-2);border-radius:10px;padding:12px;}
.recorr-linha{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:14.5px;}
.recorr-linha input{width:64px;padding:8px;border:1px solid var(--border-strong);border-radius:8px;background:var(--bg-surface);color:var(--ink-primary);font-weight:700;text-align:center;font-size:15px;}
.recorr-num{margin:10px 0 6px;font-size:13px;}
.recorr-prev{font-size:12.5px;color:var(--ink-secondary);line-height:1.45;}
.recorr-prev.err{color:var(--critical);}
.tag-rec{display:inline-block;font-size:10.5px;font-weight:700;color:var(--structural);background:var(--bg-surface-2);border:1px solid var(--border);border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:1px;}
.fin-filtros{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.fchips{display:flex;gap:6px;flex-wrap:wrap;}
.fchip{border:1px solid var(--border-strong);background:var(--bg-surface);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink-secondary);}
.fchip.on{background:var(--structural);border-color:var(--structural);color:#fff;}
.fin-obra{padding:7px 10px;border-radius:9px;border:1px solid var(--border-strong);background:var(--bg-surface);color:var(--ink-primary);font-size:13px;}
.fin-kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px;}
.nowrap{white-space:nowrap;} .muted-sm{font-size:12px;color:var(--ink-muted);}
.row-vencida td:first-child{color:var(--critical);font-weight:700;}
.btn-pay{background:var(--good-soft);border-color:transparent;color:var(--good);}
.text-crit{color:var(--critical);} .text-good{color:var(--good);}
.cal-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:16px;align-items:start;}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.cal-head h3{margin:0 6px;font-size:18px;min-width:150px;text-align:center;justify-content:center;}
.cal-resumo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px;}
.cal-resumo div{background:var(--bg-surface-2);border-radius:10px;padding:8px 10px;}
.cal-resumo span{display:block;font-size:11px;color:var(--ink-muted);font-weight:600;}
.cal-resumo b{font-family:var(--font-display);font-size:15px;font-variant-numeric:tabular-nums;}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}
.cal-dow{font-size:11px;font-weight:700;color:var(--ink-muted);text-align:center;padding:4px 0;}
.cal-cell{min-height:76px;border:1px solid var(--border);border-radius:9px;background:var(--bg-surface);padding:6px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink-primary);cursor:pointer;position:relative;}
.cal-cell.vazio{border:none;background:none;cursor:default;}
.cal-cell:hover:not(.vazio){border-color:var(--border-strong);}
.cal-num{font-size:12.5px;font-weight:700;color:var(--ink-secondary);}
.cal-cell.hoje .cal-num{background:var(--accent);color:#fff;border-radius:6px;padding:0 6px;align-self:flex-start;}
.cal-cell.sel{outline:2px solid var(--structural);outline-offset:-1px;background:var(--bg-surface-2);}
.cal-cell.tem::before{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:0 0 8px 8px;}
.cal-cell.atraso::before{background:var(--critical);} .cal-cell.aberto::before{background:var(--warning);} .cal-cell.ok::before{background:var(--good);}
.cal-val{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:auto;}

.cal-qtd{font-size:10.5px;color:var(--ink-muted);margin-bottom:3px;}
.cal-legenda{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--ink-secondary);}

.lg-atraso{background:var(--critical);} .lg-aberto{background:var(--warning);} .lg-ok{background:var(--good);}
.cal-dia{position:sticky;top:84px;}
.dia-head{margin-bottom:10px;} .dia-head h3{margin-bottom:2px;font-size:16px;}
.dia-item{border:1px solid var(--border);border-left:4px solid var(--critical);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
.dia-item.rec{border-left-color:var(--good);}
.dia-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;}
.dia-valor{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}
.dia-item.rec .dia-valor{color:var(--good);}
.dia-meta{font-size:12px;color:var(--ink-muted);margin:2px 0 8px;}
.dia-acoes{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.dia-acoes > span:last-child{display:flex;gap:4px;}
.dia-nova{width:100%;justify-content:center;}
.baixa-desc{font-size:14px;margin:0 0 14px;color:var(--ink-secondary);} .baixa-desc b{color:var(--ink-primary);}
@media (max-width:900px){
  .cal-layout{grid-template-columns:1fr;} .cal-dia{position:static;}
  .atalhos{grid-template-columns:1fr 1fr;} .atalho-contas{grid-column:1/-1;}

  .atalho{padding:12px 14px;font-size:14px;}
}

<script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js" integrity="sha384-qovJwSBbRDPP5cEjCp8S0UP66wrvnjaa60XMOGzTNanrThcrGfXfnZkvgY8N1KT3" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@5.0.8/dist/jspdf.plugin.autotable.min.js" integrity="sha384-5jk55M0XWoAw7LyhlXJe19ErOr3doBAPzxw9vahPFbvolqWa2yDk4fhHa2zuYeOa" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw" crossorigin="anonymous"></script>
<script>
(function(){
"use strict";
// Não abrir dentro de outro site (proteção contra clickjacking)
if(window.top!==window.self){ document.body.innerHTML='<p style="font:16px sans-serif;padding:24px">Por segurança, abra o Painel de Obras diretamente no navegador.</p>'; return; }

/* ============================== utils ============================== */
var SCRIPT_CLOSE = '<' + '/script>';
function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function xmlEsc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
function fmtBRL(n){
  n = Number(n)||0;
  return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function fmtNum(n){ return (Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:1}); }
function fmtPct(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return (Math.round(n*10)/10).toLocaleString('pt-BR')+'%'; }
function fmtDate(iso){
  if(!iso) return '—';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(iso))) return '—';
  var p = iso.split('-');
  return p[2]+'/'+p[1]+'/'+p[0];
}
function uid(prefix){ return (prefix||'id')+'_'+Math.random().toString(36).slice(2,10); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
var MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function monthLabel(ym){
  var p = ym.split('-'); return MESES[parseInt(p[1],10)-1]+'/'+p[0].slice(2);
}
var DOW_PT = ['DOM','SEG','TER','QUA','QUI','SEX','SAB'];
function addDays(iso,n){
  var d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function dowOf(iso){ var d = new Date(iso+'T00:00:00'); return DOW_PT[d.getDay()]; }
function dayNumOf(iso){ return parseInt(iso.split('-')[2],10); }
function daysBetweenInclusive(startIso,endIso){
  var out = []; var cur = startIso; var guard=0;
  while(cur<=endIso && guard<60){ out.push(cur); cur = addDays(cur,1); guard++; }
  return out;
}

var CODES = ['','DC','DS','CC','CS','MC','MS'];
var CODE_LABELS = {DC:'Diária c/ quentinha',DS:'Diária s/ quentinha',CC:'Contrato c/ quentinha',CS:'Contrato s/ quentinha',MC:'Meia c/ quentinha',MS:'Meia s/ quentinha'};
function codeClass(c){
  if(!c) return '';
  if(c[0]==='D') return 'code-D';
  if(c[0]==='C') return 'code-C';
  if(c[0]==='M') return 'code-M';
  return '';
}
function nextCode(c){
  var i = CODES.indexOf(c||'');
  return CODES[(i+1)%CODES.length];
}

/* ============================== state ============================== */
var STATE = {selectedObraId:null, obras:[], activeTab:'visao'};

function currentObra(){
  return STATE.obras.find(function(o){ return o.id===STATE.selectedObraId; }) || STATE.obras[0] || null;
}

/* ============================== computations ============================== */
function calcFuncionarioTotals(f){
  var codes = f.codes||[];
  var diasDiaria = 0, diasContrato = 0, quentinhas = 0;
  codes.forEach(function(c){
    if(!c) return;
    if(c[0]==='D') diasDiaria += 1;
    else if(c[0]==='M') diasDiaria += 0.5;
    else if(c[0]==='C') diasContrato += 1;
    if(c[c.length-1]==='C') quentinhas += 1;
  });
  return {diasDiaria:diasDiaria, diasContrato:diasContrato, quentinhas:quentinhas};
}
function recalcFuncionario(f){
  var t = calcFuncionarioTotals(f);
  // Funcionários com diária cadastrada em R$0 (ex.: uma verba fixa "Administração")
  // são tratados como valor manual: os códigos de dia ficam disponíveis apenas
  // para controle de presença e não sobrescrevem o total já lançado.
  if((f.diaria||0) > 0){
    f.diariaTotal = round2(t.diasDiaria * f.diaria);
    f.contrato = round2(t.diasContrato * f.diaria);
    f.total = round2((f.diariaTotal||0) + (f.contrato||0));
  }
}
function round2(n){ return Math.round((n+Number.EPSILON)*100)/100; }

function quinzenaTotals(qz){
  var somaTotal=0, quentinhas=0;
  (qz.funcionarios||[]).forEach(function(f){
    somaTotal += (f.total||0);
    quentinhas += calcFuncionarioTotals(f).quentinhas;
  });
  var maoDeObra = round2(somaTotal);
  var valorQuentinha = round2(quentinhas*(qz.vrUnd||0));
  return {maoDeObra:maoDeObra, quentinhasQtd:quentinhas, quentinhasValor:valorQuentinha, total:round2(maoDeObra+valorQuentinha)};
}

function obraCategorias(obra){
  var venda = obra.valorVenda||0;
  var maoObraExec=0, quentExec=0;
  (obra.quinzenas||[]).forEach(function(qz){
    if(!qz.pago) return;
    var t = quinzenaTotals(qz);
    maoObraExec += t.maoDeObra;
    quentExec += t.quentinhasValor;
  });
  var loteExec = (obra.lote.pagamentos||[]).reduce(function(s,p){return s+(p.valor||0);},0);
  var matOrcado = (obra.materiais||[]).reduce(function(s,m){return s+(m.valorEstimado||0);},0);
  var matExec = (obra.ledger||[]).filter(function(l){return l.categoria==='materiais';}).reduce(function(s,l){return s+(l.despesa||0);},0);
  var corretorExec = (obra.ledger||[]).filter(function(l){return l.categoria==='corretor';}).reduce(function(s,l){return s+(l.despesa||0);},0);
  var corretorOrcado = round2((obra.corretor.percentual||0)/100*venda);
  var cats = [
    {key:'lote', label:'Lote', color:'var(--cat-lote)', orcado:obra.lote.orcado||0, executado:round2(loteExec)},
    {key:'materiais', label:'Materiais da obra', color:'var(--cat-mat)', orcado:round2(matOrcado), executado:round2(matExec)},
    {key:'maoDeObra', label:'Mão de obra', color:'var(--cat-mao)', orcado:obra.maoDeObra.orcado||0, executado:round2(maoObraExec)},
    {key:'quentinha', label:'Quentinha', color:'var(--cat-quent)', orcado:obra.quentinha.orcado||0, executado:round2(quentExec)},
    {key:'corretor', label:'Corretor', color:'var(--cat-corr)', orcado:corretorOrcado, executado:round2(corretorExec), percentual:obra.corretor.percentual||0}
  ];
  cats.forEach(function(c){
    c.aPagar = Math.max(0, round2(c.orcado - c.executado));
    c.pctVenda = venda>0 ? (c.executado/venda*100) : 0;
    c.pctConclusao = c.orcado>0 ? clamp(c.executado/c.orcado*100,0,999) : null;
    c.temOrcamento = c.orcado>0;
  });
  return cats;
}

function obraResumoFinanceiro(obra){
  var receita=0, despesa=0;
  (obra.ledger||[]).forEach(function(l){ receita+=(l.receita||0); despesa+=(l.despesa||0); });
  var venda = obra.valorVenda||0;
  var cats = obraCategorias(obra);
  var custoOrcadoTotal = cats.reduce(function(s,c){return s+c.orcado;},0);
  var lucroProjetado = round2(venda - custoOrcadoTotal);
  return {
    receita: round2(receita), despesa: round2(despesa), saldo: round2(receita-despesa),
    pctRecebido: venda>0 ? (receita/venda*100) : 0,
    lucroProjetado: lucroProjetado, custoOrcadoTotal: round2(custoOrcadoTotal)
  };
}

function despesasPorCategoria(obra){
  var map = {};
  (obra.ledger||[]).forEach(function(l){
    if(!l.despesa) return;
    map[l.categoria] = (map[l.categoria]||0) + l.despesa;
  });
  var labels = {lote:'Lote',materiais:'Materiais',maoDeObra:'Mão de obra',quentinha:'Quentinha',corretor:'Corretor'};
  var colors = {lote:'var(--cat-lote)',materiais:'var(--cat-mat)',maoDeObra:'var(--cat-mao)',quentinha:'var(--cat-quent)',corretor:'var(--cat-corr)'};
  return Object.keys(map).map(function(k){
    return {key:k, label:labels[k]||k, value:round2(map[k]), color:colors[k]||'var(--cat-outros)'};
  }).sort(function(a,b){return b.value-a.value;});
}

function ledgerPorMes(obra){
  var map = {};
  (obra.ledger||[]).forEach(function(l){
    if(!l.data) return;
    var m = l.data.slice(0,7);
    if(!map[m]) map[m]={receita:0,despesa:0};
    map[m].receita += (l.receita||0);
    map[m].despesa += (l.despesa||0);
  });
  return Object.keys(map).sort().map(function(m){ return {mes:m,label:monthLabel(m),receita:round2(map[m].receita),despesa:round2(map[m].despesa)}; });
}

/* ============================== SVG charts ============================== */
function svgDonut(segments, size){
  size = size||150;
  var r = size/2 - 10, cx=size/2, cy=size/2, circ = 2*Math.PI*r;
  var total = segments.reduce(function(s,x){return s+x.value;},0);
  var offset = 0;
  var arcs = '';
  if(total<=0){
    arcs = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--border-strong)" stroke-width="16"></circle>';
  } else {
    segments.forEach(function(seg){
      var pct = seg.value/total;
      var len = pct*circ;
      var gap = Math.max(0, circ*0.006);
      var dash = Math.max(0,len-gap)+' '+(circ-Math.max(0,len-gap));
      arcs += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+seg.color+'" stroke-width="16" ' +
        'stroke-dasharray="'+dash+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+cx+' '+cy+')" stroke-linecap="butt">' +
        '<title>'+esc(seg.label)+': '+esc(fmtBRL(seg.value))+' ('+esc(fmtPct(pct*100))+')</title></circle>';
      offset += len;
    });
  }
  var centerVal = fmtBRL(total).replace('R$','').trim();
  return '<svg class="bars-svg" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="Despesas por categoria">' +
    arcs +
    '<text x="'+cx+'" y="'+(cy-3)+'" text-anchor="middle" font-family="var(--font-display)" font-size="15" font-weight="700" fill="var(--ink-primary)">R$'+esc(centerVal)+'</text>' +
    '<text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" font-size="10" fill="var(--ink-muted)">total gasto</text>' +
    '</svg>';
}

function svgMiniDonut(pago, aPagar, size, label){
  size = size||120;
  var r = size/2 - 9, cx=size/2, cy=size/2, circ = 2*Math.PI*r;
  var total = Math.max(0,pago) + Math.max(0,aPagar);
  var arcs = '';
  if(total<=0){
    arcs = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--border-strong)" stroke-width="14"></circle>';
  } else {
    var segs = [
      {value: Math.max(0,pago), color:'var(--good)', name:'Pago'},
      {value: Math.max(0,aPagar), color:'var(--warning)', name:'A pagar'}
    ];
    var offset = 0;
    segs.forEach(function(seg){
      if(seg.value<=0) return;
      var pct = seg.value/total;
      var len = pct*circ;
      var gap = Math.max(0, circ*0.008);
      var dash = Math.max(0,len-gap)+' '+(circ-Math.max(0,len-gap));
      arcs += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+seg.color+'" stroke-width="14" ' +
        'stroke-dasharray="'+dash+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+cx+' '+cy+')" stroke-linecap="butt">' +
        '<title>'+esc(seg.name)+': '+esc(fmtBRL(seg.value))+' ('+esc(fmtPct(pct*100))+')</title></circle>';
      offset += len;
    });
  }
  var pctPago = total>0 ? (pago/total*100) : 0;
  return '<svg class="bars-svg" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="'+esc(label||'')+'">' +
    arcs +
    '<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-family="var(--font-display)" font-size="14" font-weight="700" fill="var(--ink-primary)">'+esc(fmtPct(pctPago))+'</text>' +
    '<text x="'+cx+'" y="'+(cy+13)+'" text-anchor="middle" font-size="9" fill="var(--ink-muted)">pago</text>' +
    '</svg>';
}

function svgBars(months){
  var w = Math.max(320, months.length*84), h = 200, padL=44, padB=26, padT=10;
  var innerW = w-padL-16, innerH = h-padB-padT;
  var maxV = 1;
  months.forEach(function(m){ maxV = Math.max(maxV,m.receita,m.despesa); });
  maxV = Math.ceil(maxV/1000)*1000 || 1000;
  var groupW = innerW/Math.max(1,months.length);
  var barW = Math.min(20, groupW/2.6);
  var grid = '';
  for(var g=0;g<=4;g++){
    var y = padT + innerH - (g/4)*innerH;
    grid += '<line class="grid-line" x1="'+padL+'" x2="'+(padL+innerW)+'" y1="'+y+'" y2="'+y+'"></line>';
    grid += '<text x="'+(padL-8)+'" y="'+(y+3)+'" text-anchor="end">'+esc(fmtNum(maxV*g/4/1000))+'k</text>';
  }
  var bars='', labels='';
  months.forEach(function(m,i){
    var gx = padL + i*groupW + groupW/2;
    var hr = (m.receita/maxV)*innerH, hd = (m.despesa/maxV)*innerH;
    var xr = gx-barW-2, xd = gx+2;
    bars += '<rect x="'+xr+'" y="'+(padT+innerH-hr)+'" width="'+barW+'" height="'+Math.max(1,hr)+'" rx="3" fill="var(--cat-receita)"><title>'+esc(m.label)+' · Recebido: '+esc(fmtBRL(m.receita))+'</title></rect>';
    bars += '<rect x="'+xd+'" y="'+(padT+innerH-hd)+'" width="'+barW+'" height="'+Math.max(1,hd)+'" rx="3" fill="var(--cat-despesa)"><title>'+esc(m.label)+' · Despesa: '+esc(fmtBRL(m.despesa))+'</title></rect>';
    labels += '<text x="'+gx+'" y="'+(h-6)+'" text-anchor="middle">'+esc(m.label)+'</text>';
  });
  return '<svg class="bars-svg" width="100%" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMinYMid meet">' +
    '<line class="axis-line" x1="'+padL+'" x2="'+padL+'" y1="'+padT+'" y2="'+(padT+innerH)+'"></line>' +
    '<line class="axis-line" x1="'+padL+'" x2="'+(padL+innerW)+'" y1="'+(padT+innerH)+'" y2="'+(padT+innerH)+'"></line>' +
    grid + bars + labels + '</svg>';
}

/* ============================== render ============================== */
function el(html){ var d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }

function render(){
  var app = document.getElementById('app');
  app.innerHTML = renderTopbar() + '<div class="shell">' + renderBody() + '</div>' + renderDialogs() + renderFab() + renderToastHost();
  wireDialogsOnce();
  wireFinanceiro();
  aplicarPermissoes();
}

function renderTopbar(){
  var obra = currentObra();
  var options = STATE.obras.map(function(o){
    return '<option value="'+esc(o.id)+'"'+(o.id===STATE.selectedObraId?' selected':'')+'>'+esc(o.nomeDono)+'</option>';
  }).join('');
  return (
  '<div class="topbar"><div class="topbar-inner">' +
    '<div class="brand"><div class="brand-mark">O</div><div class="brand-text"><h1>Painel de Obras</h1><span>controle financeiro por obra</span></div></div>' +
    '<div class="obra-switch">'+(STATE.obras.length?'<select id="obra-select" data-action="select-obra">'+options+'</select>':'') +
      '<button class="btn btn-ghost-dark btn-sm" data-action="new-obra">+ Nova obra</button></div>' +
    '<div class="save-status"><span class="save-dot" id="save-dot"></span><span id="save-label">Salvo</span></div>' +
    '<button class="btn btn-icon btn-ghost-dark" data-action="toggle-theme" title="Alternar tema">'+themeIcon()+'</button>' +
    '<div class="user-chip"><span class="user-who"><b>'+esc(CTX?CTX.nome:'')+'</b><span>'+esc(AUTH_USER||'')+' · '+esc(CTX?PAPEIS[CTX.papel]:'')+'</span></span>' +
      '<button class="btn btn-ghost-dark btn-sm" data-action="perfil-construtora">Construtora</button>' +
      (ehAdmin()&&CTX.situacao?'<button class="btn btn-ghost-dark btn-sm" data-action="assinatura">Assinatura'+(CTX&&CTX.situacao==='teste'?'<span class="btn-topo-pill">teste</span>':(CTX&&CTX.situacao==='vencida'?'<span class="btn-topo-pill">vencida</span>':''))+'</button>':'') +
      (EH_DONO?'<button class="btn btn-ghost-dark btn-sm" data-action="dono">Dono</button>':'') +
      (ehAdmin()?'<button class="btn btn-ghost-dark btn-sm" data-action="usuarios">Usuários</button>':'') +
      '<button class="btn btn-ghost-dark btn-sm" data-action="logout">Sair</button></div>' +
  '</div></div>'
  );
}
function themeIcon(){
  var t = document.documentElement.getAttribute('data-theme');
  if(t==='dark') return '&#9789;';
  if(t==='light') return '&#9788;';
  return '&#9737;';
}

function renderBody(){
  var obra = currentObra();
  if(!obra){
    return '<div class="card empty-state"><div class="big">🏗️</div><h3>Nenhuma obra cadastrada</h3>' +
      '<p>Cadastre a primeira obra para começar a acompanhar recebimentos, despesas e progresso.</p>' +
      '<button class="btn btn-accent" data-action="new-obra">+ Cadastrar obra</button></div>';
  }
  var tabs = [['visao','Visão geral'],['lancamentos','Lançamentos'],['contas','Contas a pagar/receber'],['calendario','Calendário'],['maodeobra','Mão de obra & quentinhas'],['materiais','Materiais'],['drive','Arquivos']];
  var tabsHtml = tabs.map(function(t){
    return '<button class="tab'+(STATE.activeTab===t[0]?' active':'')+'" data-action="switch-tab" data-tab="'+t[0]+'">'+t[1]+'</button>';
  }).join('');
  var content;
  if(STATE.activeTab==='lancamentos') content = renderLancamentos(obra);
  else if(STATE.activeTab==='maodeobra') content = renderMaoDeObra(obra);
  else if(STATE.activeTab==='materiais') content = renderMateriais(obra);
  else if(STATE.activeTab==='drive') content = renderDrive(obra);
  else if(STATE.activeTab==='contas') content = renderContas();
  else if(STATE.activeTab==='calendario') content = renderCalendario();
  else content = renderAtalhos() + renderVisaoGeral(obra);

  return renderObraHeader(obra) + '<div class="tabs">'+tabsHtml+'</div>' + content;
}

function renderObraHeader(obra){
  return (
  '<div class="obra-card">' +
    '<div class="obra-id"><h2>'+esc(obra.nomeDono)+'</h2>' +
      '<div class="obra-meta">' +
        '<div><strong>'+esc(obra.endereco||'—')+'</strong>Endereço</div>' +
        '<div><strong>'+esc(obra.contato||'—')+'</strong>Contato</div>' +
        '<div><strong>'+fmtDate(obra.dataInicio)+'</strong>Início</div>' +
        '<div><strong>'+fmtBRL(obra.valorVenda)+'</strong>Valor de venda</div>' +
        (obra.corretor.percentual>0 ? '<div><strong>'+obra.corretor.percentual+'% · '+fmtBRL(obra.corretor.percentual/100*obra.valorVenda)+'</strong>Comissão do corretor</div>' : '') +
      '</div>' +
    '</div>' +
    '<div class="obra-actions">' +
      '<button class="btn btn-sm" data-action="edit-obra">Editar cadastro</button>' +
      '<button class="btn btn-sm" data-action="export-csv">Exportar CSV</button>' +
      '<button class="btn btn-sm btn-danger" data-action="delete-obra">Excluir</button>' +
    '</div>' +
  '</div>');
}

function renderVisaoGeral(obra){
  var fin = obraResumoFinanceiro(obra);
  var cats = obraCategorias(obra);
  var kpis = [
    {label:'Valor de venda', value: fmtBRL(obra.valorVenda), sub:''},
    {label:'Recebido', value: fmtBRL(fin.receita), sub: fmtPct(fin.pctRecebido)+' do valor de venda', cls:'good'},
    {label:'Despesas totais', value: fmtBRL(fin.despesa), sub:'todas as categorias'},
    {label:'Saldo em caixa', value: fmtBRL(fin.saldo), sub:'recebido − despesas', cls: fin.saldo>=0?'good':'critical'},
    {label:'Lucro projetado', value: fmtBRL(fin.lucroProjetado), sub:'venda − custo orçado'}
  ];
  var kpiHtml = kpis.map(function(k){
    return '<div class="kpi-tile"><div class="kpi-label">'+k.label+'</div><div class="kpi-value'+(k.cls?' '+k.cls:'')+'">'+k.value+'</div>'+(k.sub?'<div class="kpi-sub">'+k.sub+'</div>':'')+'</div>';
  }).join('');

  var metersHtml = cats.map(function(c){
    if(!c.temOrcamento){
      return '<div class="meter-row"><span class="meter-dot" style="background:'+c.color+'"></span>' +
        '<div class="meter-body"><div class="meter-top"><b>'+c.label+'</b><span class="badge badge-muted">sem orçamento definido</span></div>' +
        '<div class="meter-nums"><span>Gasto: '+fmtBRL(c.executado)+'</span><span>'+fmtPct(c.pctVenda)+' da venda</span></div></div>' +
        '</div>';
    }
    var pct = clamp(c.pctConclusao,0,100);
    var over = c.pctConclusao>100;
    return '<div class="meter-row"><span class="meter-dot" style="background:'+c.color+'"></span>' +
      '<div class="meter-body">' +
        '<div class="meter-top"><b>'+c.label+'</b>' + (over?'<span class="badge badge-crit">acima do orçado</span>':(c.pctConclusao>=100?'<span class="badge badge-good">concluído</span>':'')) + '</div>' +
        '<div class="meter-track"><div class="meter-fill" style="width:'+pct+'%;background:'+(over?'var(--critical)':c.color)+'"></div></div>' +
        '<div class="meter-nums"><span>Executado '+fmtBRL(c.executado)+'</span><span>A pagar '+fmtBRL(c.aPagar)+'</span><span>Orçado '+fmtBRL(c.orcado)+'</span></div>' +
      '</div>' +
      '<div class="meter-pct">'+fmtPct(c.pctConclusao)+'</div>' +
      '</div>';
  }).join('');

  var donutData = despesasPorCategoria(obra);
  var donutLegend = donutData.map(function(d){
    return '<div class="legend-item"><span class="legend-dot" style="background:'+d.color+'"></span>'+d.label+' · '+fmtBRL(d.value)+'</div>';
  }).join('') || '<div class="legend-item text-muted">Sem despesas lançadas ainda</div>';

  var months = ledgerPorMes(obra);

  var catLote = cats[0], catMao = cats[2];
  function miniDonutCard(title, cat){
    var legend = '<div class="legend-item"><span class="legend-dot" style="background:var(--good)"></span>Pago · '+fmtBRL(cat.executado)+'</div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:var(--warning)"></span>A pagar · '+fmtBRL(cat.aPagar)+'</div>';
    return '<div class="card"><h3>'+title+'</h3>' +
      '<div class="donut-wrap">'+svgMiniDonut(cat.executado, cat.aPagar, 120, title)+'<div class="legend" style="margin-top:0;flex-direction:column;gap:8px;">'+legend+'</div></div>' +
      '</div>';
  }

  return (
  '<div class="grid grid-kpi" style="margin-bottom:18px;">'+kpiHtml+'</div>' +
  '<div class="grid grid-2">' +
    '<div class="card"><h3>Progresso por categoria <span class="hint">% sobre o valor de venda</span></h3>'+metersHtml+'</div>' +
    '<div class="card"><h3>Despesas por categoria</h3>' +
      '<div class="donut-wrap">'+svgDonut(donutData,150)+'<div class="legend" style="margin-top:0;flex-direction:column;gap:8px;">'+donutLegend+'</div></div>' +
    '</div>' +
    miniDonutCard('Lote: pago × a pagar', catLote) +
    miniDonutCard('Mão de obra: pago × a pagar', catMao) +
  '</div>' +
  '<div class="card" style="margin-top:16px;"><h3>Recebido × despesa por mês</h3>' +
    (months.length ? svgBars(months) : '<div class="empty-state">Sem lançamentos ainda.</div>') +
    '<div class="legend"><div class="legend-item"><span class="legend-dot" style="background:var(--cat-receita)"></span>Recebido</div><div class="legend-item"><span class="legend-dot" style="background:var(--cat-despesa)"></span>Despesa</div></div>' +
  '</div>'
  );
}

function catLabel(k){
  return {receita:'Receita',lote:'Lote',materiais:'Materiais',maoDeObra:'Mão de obra',quentinha:'Quentinha',corretor:'Corretor'}[k]||esc(k);
}
function catColor(k){
  return {receita:'var(--cat-receita)',lote:'var(--cat-lote)',materiais:'var(--cat-mat)',maoDeObra:'var(--cat-mao)',quentinha:'var(--cat-quent)',corretor:'var(--cat-corr)'}[k]||'var(--cat-outros)';
}

function filteredLedger(obra){
  var de = lancamentoFiltro.de, ate = lancamentoFiltro.ate;
  return (obra.ledger||[]).filter(function(l){
    if(de && (!l.data || l.data<de)) return false;
    if(ate && (!l.data || l.data>ate)) return false;
    return true;
  });
}
function renderLancamentos(obra){
  var all = (obra.ledger||[]).slice().sort(function(a,b){ return (a.data||'')<(b.data||'') ? 1 : -1; });
  var saldo = 0;
  var allAsc = all.slice().reverse();
  var saldoMap = {};
  allAsc.forEach(function(l){ saldo += (l.receita||0)-(l.despesa||0); saldoMap[l.id] = saldo; });

  var rows = filteredLedger(obra).slice().sort(function(a,b){ return (a.data||'')<(b.data||'') ? 1 : -1; });

  var totReceita=0, totDespesa=0;
  rows.forEach(function(l){ totReceita += (l.receita||0); totDespesa += (l.despesa||0); });

  var body = rows.map(function(l){
    return '<tr>' +
      '<td>'+esc(l.discriminacao)+'</td>' +
      '<td><span class="cat-pill"><span class="cat-dot" style="background:'+catColor(l.categoria)+'"></span>'+catLabel(l.categoria)+'</span></td>' +
      '<td>'+esc(l.pagador||'—')+'</td>' +
      '<td>'+fmtDate(l.data)+'</td>' +
      '<td class="num text-good">'+(l.receita?fmtBRL(l.receita):'—')+'</td>' +
      '<td class="num text-crit">'+(l.despesa?fmtBRL(l.despesa):'—')+'</td>' +
      '<td class="num">'+fmtBRL(saldoMap[l.id])+'</td>' +
      '<td class="row-actions">' +
        '<button class="btn btn-sm btn-icon" data-action="edit-lancamento" data-id="'+esc(l.id)+'" title="Editar">&#9998;</button>' +
        '<button class="btn btn-sm btn-icon" data-action="delete-lancamento" data-id="'+esc(l.id)+'" title="Remover">&times;</button>' +
      '</td>' +
    '</tr>';
  }).join('') || '<tr><td colspan="8" class="empty-state">Nenhum lançamento neste período.</td></tr>';

  var footer = '<tfoot><tr>' +
    '<td colspan="4" style="font-weight:700;">Total do período ('+rows.length+' lançamento'+(rows.length===1?'':'s')+')</td>' +
    '<td class="num text-good" style="font-weight:700;">'+fmtBRL(totReceita)+'</td>' +
    '<td class="num text-crit" style="font-weight:700;">'+fmtBRL(totDespesa)+'</td>' +
    '<td class="num" style="font-weight:700;">'+fmtBRL(totReceita-totDespesa)+'</td>' +
    '<td></td>' +
  '</tr></tfoot>';

  var corretorCat = obraCategorias(obra).find(function(c){return c.key==='corretor';});
  var corretorBanner = '';
  if(corretorCat && (corretorCat.executado>0 || corretorCat.orcado>0)){
    corretorBanner = '<div class="card" style="margin-bottom:14px;border-left:3px solid '+corretorCat.color+';">' +
      '<div style="display:flex;gap:24px;flex-wrap:wrap;align-items:center;">' +
        '<div><div class="kpi-label">Corretor — pago</div><div class="kpi-value" style="font-size:17px;">'+fmtBRL(corretorCat.executado)+'</div></div>' +
        (corretorCat.temOrcamento ?
          '<div><div class="kpi-label">A pagar</div><div class="kpi-value" style="font-size:17px;">'+fmtBRL(corretorCat.aPagar)+'</div></div>' +
          '<div><div class="kpi-label">Comissão total ('+corretorCat.percentual+'% da venda)</div><div class="kpi-value" style="font-size:17px;">'+fmtBRL(corretorCat.orcado)+'</div></div>'
          : '<div class="badge badge-muted">sem % de comissão definido no cadastro da obra</div>') +
      '</div></div>';
  }

  return (
  '<div class="toolbar"><div><div class="section-title">Lançamentos</div><div class="section-desc" style="margin-bottom:0;">Extrato de receitas e despesas da obra.</div></div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
      '<button class="btn" data-action="import-lancamentos">Importar planilha</button>' +
      '<button class="btn" data-action="export-xml">Baixar XML</button>' +
      '<button class="btn" data-action="export-csv">Exportar CSV</button>' +
      '<button class="btn btn-accent" data-action="new-lancamento">+ Novo lançamento</button>' +
    '</div></div>' +
  '<div class="card" style="margin-bottom:14px;"><div class="field-row" style="align-items:flex-end;flex-wrap:wrap;">' +
    '<div class="field" style="max-width:180px;margin-bottom:0;"><label>Período — de</label><input type="date" value="'+esc(lancamentoFiltro.de)+'" data-action="filtro-de"></div>' +
    '<div class="field" style="max-width:180px;margin-bottom:0;"><label>Período — até</label><input type="date" value="'+esc(lancamentoFiltro.ate)+'" data-action="filtro-ate"></div>' +
    '<button class="btn btn-sm" data-action="limpar-filtro" style="margin-bottom:12px;">Limpar período</button>' +
  '</div></div>' +
  corretorBanner +
  '<div class="card"><div class="table-wrap"><table><thead><tr><th>Discriminação</th><th>Categoria</th><th>Pagador</th><th>Data</th><th class="num">Receita</th><th class="num">Despesa</th><th class="num">Saldo</th><th></th></tr></thead><tbody>'+body+'</tbody>'+footer+'</table></div></div>'
  );
}

function renderMaoDeObra(obra){
  var equipeRows = (obra.equipe||[]).map(function(f){
    return '<tr><td>'+esc(f.nome)+'</td><td>'+esc(f.cargo||'—')+'</td><td class="num">'+fmtBRL(f.diariaPadrao)+'</td>' +
      '<td class="row-actions"><button class="btn btn-sm btn-icon" data-action="delete-funcionario" data-nome="'+esc(f.nome)+'" title="Remover da equipe">&times;</button></td></tr>';
  }).join('') || '<tr><td colspan="4" class="empty-state">Nenhum funcionário cadastrado.</td></tr>';

  var qzs = (obra.quinzenas||[]).slice().reverse();
  var qzHtml = qzs.map(function(qz){ return renderQuinzena(obra, qz); }).join('') || '<div class="empty-state">Nenhuma quinzena registrada ainda.</div>';

  return (
  '<div class="grid grid-2b" style="align-items:start;">' +
    '<div>' +
      '<div class="toolbar"><div class="section-title" style="font-size:15px;">Quinzenas</div><button class="btn btn-accent btn-sm" data-action="new-quinzena">+ Nova quinzena</button></div>' +
      qzHtml +
    '</div>' +
    '<div>' +
      '<div class="card"><h3>Equipe <span class="hint">cadastro reutilizado nas quinzenas</span></h3>' +
        '<table><thead><tr><th>Nome</th><th>Cargo</th><th class="num">Diária</th><th></th></tr></thead><tbody>'+equipeRows+'</tbody></table>' +
        '<button class="btn btn-sm" style="margin-top:10px;" data-action="new-funcionario">+ Adicionar à equipe</button>' +
      '</div>' +
    '</div>' +
  '</div>'
  );
}

function renderQuinzena(obra, qz){
  var t = quinzenaTotals(qz);
  var days = qz.days||[];
  var rosterOptions = (obra.equipe||[]).filter(function(f){
    return !(qz.funcionarios||[]).some(function(qf){return qf.nome===f.nome;});
  }).map(function(f){ return '<option value="'+esc(f.nome)+'">'+esc(f.nome)+'</option>'; }).join('');
  var head = '<tr><th class="name-cell">Funcionário</th><th class="cargo-cell">Cargo</th>' +
    days.map(function(d){ return '<th>'+esc(d.dow)+'<br>'+esc(d.num)+'</th>'; }).join('') +
    '<th>Contrato</th><th>Diária</th><th>Total</th><th></th></tr>';
  var body = (qz.funcionarios||[]).map(function(f,fi){
    var cells = (f.codes||[]).map(function(c,ci){
      return '<td class="code-cell '+codeClass(c)+'" data-action="cycle-code" data-qz="'+esc(qz.id)+'" data-fi="'+fi+'" data-day="'+ci+'" title="'+(CODE_LABELS[c]||'Clique para marcar')+'">'+esc(c||'·')+'</td>';
    }).join('');
    return '<tr><td class="name-cell">'+esc(f.nome)+'</td><td class="cargo-cell">'+esc(f.cargo||'—')+'</td>'+cells +
      '<td><input class="editable-num" type="number" step="0.01" value="'+sNum(f.contrato)+'" data-action="edit-contrato" data-qz="'+esc(qz.id)+'" data-fi="'+fi+'"></td>' +
      '<td class="num">'+fmtBRL(f.diariaTotal||0)+'</td>' +
      '<td class="num">'+fmtBRL(f.total||0)+'</td>' +
      '<td><button class="btn btn-sm btn-icon" data-action="remove-func-quinzena" data-qz="'+esc(qz.id)+'" data-fi="'+fi+'" title="Remover">&times;</button></td></tr>';
  }).join('');

  return (
  '<div class="card quinzena-card"><div class="qz-title-row">' +
    '<h4>'+esc(qz.titulo)+'</h4>' +
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' +
      '<label class="check-row"><input type="checkbox" data-action="toggle-pago" data-qz="'+esc(qz.id)+'" '+(qz.pago?'checked':'')+'> Paga</label>' +
      '<button class="btn btn-sm" data-action="download-quinzena-pdf" data-qz="'+esc(qz.id)+'">Baixar PDF</button>' +
      '<button class="btn btn-sm btn-icon" data-action="delete-quinzena" data-qz="'+esc(qz.id)+'" title="Excluir">&times;</button>' +
    '</div></div>' +
  '<div class="daygrid-wrap"><table class="daygrid"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>' +
  '<div class="field-row" style="margin-top:10px;max-width:520px;flex-wrap:wrap;">' +
    '<select class="small" data-action="add-func-select" data-qz="'+esc(qz.id)+'"><option value="">+ adicionar funcionário…</option>'+rosterOptions+'</select>' +
    '<button class="btn btn-sm" data-action="new-contrato-quinzena" data-qz="'+esc(qz.id)+'">+ Lançamento de contrato</button>' +
  '</div>' +
  '<div class="qz-summary">' +
    '<span>Mão de obra: <b>'+fmtBRL(t.maoDeObra)+'</b></span>' +
    '<span>Quentinhas: <b>'+t.quentinhasQtd+'</b> × '+fmtBRL(qz.vrUnd||0)+' = <b>'+fmtBRL(t.quentinhasValor)+'</b> ' +
      '<button class="btn btn-sm" data-action="edit-vrund" data-qz="'+esc(qz.id)+'" style="margin-left:4px;">editar valor unit.</button></span>' +
    '<span>Total da quinzena: <b>'+fmtBRL(t.total)+'</b></span>' +
  '</div>' +
  '<div class="qz-legend">'+Object.keys(CODE_LABELS).map(function(k){return '<span><b class="mono">'+k+'</b> '+CODE_LABELS[k]+'</span>';}).join('')+'</div>' +
  '</div>'
  );
}

function renderMateriais(obra){
  var list = obra.materiais||[];
  var total = list.reduce(function(s,m){return s+(m.valorEstimado||0);},0);
  var comprados = list.filter(function(m){return m.comprado;});
  var totalComprado = comprados.reduce(function(s,m){return s+(m.valorEstimado||0);},0);
  var rows = list.map(function(m){
    return '<tr class="material-row'+(m.comprado?' bought':'')+'"><td><label class="check-row"><input type="checkbox" data-action="toggle-material" data-id="'+esc(m.id)+'" '+(m.comprado?'checked':'')+'> <span class="mname">'+esc(m.discriminacao)+'</span></label></td>' +
      '<td class="num">'+fmtBRL(m.valorEstimado)+'</td>' +
      '<td class="row-actions">' +
        '<button class="btn btn-sm btn-icon" data-action="edit-material" data-id="'+esc(m.id)+'" title="Editar">&#9998;</button>' +
        '<button class="btn btn-sm btn-icon" data-action="delete-material" data-id="'+esc(m.id)+'" title="Remover">&times;</button>' +
      '</td></tr>';
  }).join('') || '<tr><td colspan="3" class="empty-state">Nenhum material previsto.</td></tr>';
  return (
  '<div class="toolbar"><div><div class="section-title">Materiais previstos</div><div class="section-desc" style="margin-bottom:0;">'+comprados.length+' de '+list.length+' itens comprados · '+fmtBRL(totalComprado)+' de '+fmtBRL(total)+'</div></div>' +
    '<button class="btn btn-accent" data-action="new-material">+ Novo item</button></div>' +
  '<div class="card"><table><thead><tr><th>Item previsto</th><th class="num">Valor estimado</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'
  );
}

function renderDrive(obra){
  var items = obra.drive||[];
  var cards = items.map(function(it){
    var preview = (it.tipo==='arquivo' && it.mime && it.mime.indexOf('image/')===0) ? (dataUrlSegura(it.dataUrl)?'<img alt="" src="'+esc(dataUrlSegura(it.dataUrl))+'">':'') : '';
    var action = it.tipo==='link'
      ? (urlSegura(it.url) ? '<a href="'+esc(urlSegura(it.url))+'" target="_blank" rel="noopener noreferrer">Abrir link</a>' : '<span class="muted-sm">link inválido</span>')
      : '<button class="btn btn-sm" data-action="download-drive" data-id="'+esc(it.id)+'">Baixar</button>';
    return '<div class="drive-item"><div class="cat">'+esc(it.categoria)+'</div>'+preview+'<div class="fname">'+esc(it.nome)+'</div>' +
      '<div class="foot"><span>'+fmtDate(it.data)+'</span>'+action+'</div>' +
      '<button class="btn btn-sm btn-danger" style="margin-top:8px;width:100%;" data-action="delete-drive" data-id="'+esc(it.id)+'">Remover</button>' +
      '</div>';
  }).join('');
  return (
  '<div class="toolbar"><div><div class="section-title">Arquivos da obra</div><div class="section-desc" style="margin-bottom:0;">Projetos, documentos e links — como um drive da obra.</div></div>' +
    '<button class="btn btn-accent" data-action="new-drive">+ Adicionar arquivo</button></div>' +
  (items.length ? '<div class="drive-grid">'+cards+'</div>' : '<div class="card empty-state"><div class="big">🗂️</div>Nenhum arquivo ainda. Adicione projetos, contratos, fotos ou links.</div>')
  );
}
