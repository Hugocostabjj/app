/* ============================== construtora: CNPJ e perfil ==============================
   Os dados vêm da base pública do CNPJ da Receita Federal (via BrasilAPI e, se ela falhar, CNPJá).
   O site oficial da Receita (cnpjreva) exige captcha e não permite consulta automática;
   o link para conferência manual aparece junto dos dados. */
var CNPJ_BUSCA = {};
var RECEITA_URL = 'https://solucoes.receita.fazenda.gov.br/Servicos/cnpjreva/cnpjreva_solicitacao.asp';
function soDigitos(s){ return String(s||'').replace(/\D/g,''); }
function cnpjValido(c){
  c=soDigitos(c); if(c.length!==14 || /^(\d)\1{13}$/.test(c)) return false;
  function dv(base){ var pesos = base.length===12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2], s=0;
    for(var i=0;i<base.length;i++) s+= (+base[i])*pesos[i]; var r=s%11; return r<2?0:11-r; }
  return dv(c.slice(0,12))===+c[12] && dv(c.slice(0,13))===+c[13];
}
function cnpjMascara(c){ c=soDigitos(c).slice(0,14); return c.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2'); }
function cepMascara(c){ c=soDigitos(c); return c.length===8 ? c.slice(0,5)+'-'+c.slice(5) : c; }
function lim(s,n){ return s==null ? '' : String(s).trim().slice(0,n); }
function nomeExibicao(d){ return lim(d && (d.nome_fantasia || d.razao_social), 120) || 'Construtora'; }
function sitAlerta(s){ return !!s && String(s).toUpperCase()!=='ATIVA'; }
function enderecoTexto(d){
  var l1=[d.logradouro,d.numero].filter(Boolean).join(', ') + (d.complemento?' - '+d.complemento:'');
  var l2=[d.bairro, [d.municipio,d.uf].filter(Boolean).join('/')].filter(Boolean).join(' · ');
  return [l1, l2, d.cep?'CEP '+cepMascara(d.cep):''].filter(Boolean).join(' — ');
}
function dataBR(s){ s=String(s||''); var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3]+'/'+m[2]+'/'+m[1] : s; }

async function buscaJson(url){
  var ctl = ('AbortController' in window) ? new AbortController() : null;
  var t = setTimeout(function(){ if(ctl) ctl.abort(); }, 10000);
  try{
    var r = await fetch(url, {signal: ctl?ctl.signal:undefined, headers:{'Accept':'application/json'}, credentials:'omit', referrerPolicy:'no-referrer'});
    if(r.status===404) return {naoAchou:true};
    if(!r.ok) return {falhou:true};
    return {json: await r.json()};
  }catch(e){ return {falhou:true}; } finally { clearTimeout(t); }
}
function normBrasilApi(j, c){
  var tel = lim(j.ddd_telefone_1,20).replace(/\D/g,'');
  return {cnpj:c, razao_social:lim(j.razao_social,200), nome_fantasia:lim(j.nome_fantasia,200),
    situacao:lim(j.descricao_situacao_cadastral,40), data_abertura:lim(j.data_inicio_atividade,10),
    natureza_juridica:lim(j.natureza_juridica,150), porte:lim(j.porte||j.descricao_porte,60),
    cnae_principal: j.cnae_fiscal ? lim(j.cnae_fiscal+' - '+(j.cnae_fiscal_descricao||''),250) : '',
    logradouro:lim([j.descricao_tipo_de_logradouro, j.logradouro].filter(Boolean).join(' '),200), numero:lim(j.numero,30),
    complemento:lim(j.complemento,150), bairro:lim(j.bairro,120), municipio:lim(j.municipio,120), uf:lim(j.uf,2),
    cep:soDigitos(j.cep).slice(0,8), telefone: tel.length>=10 ? '('+tel.slice(0,2)+') '+tel.slice(2) : '', email:lim(j.email,150), fonte:'receita'};
}
function normCnpja(j, c){
  var co=j.company||{}, ad=j.address||{}, ph=(j.phones||[])[0], em=(j.emails||[])[0], at=j.mainActivity||{};
  return {cnpj:c, razao_social:lim(co.name,200), nome_fantasia:lim(j.alias,200),
    situacao:lim(j.status&&j.status.text,40), data_abertura:lim(j.founded,10),
    natureza_juridica:lim(co.nature&&co.nature.text,150), porte:lim(co.size&&co.size.text,60),
    cnae_principal: at.id ? lim(at.id+' - '+(at.text||''),250) : '',
    logradouro:lim(ad.street,200), numero:lim(ad.number,30), complemento:lim(ad.details,150), bairro:lim(ad.district,120),
    municipio:lim(ad.city,120), uf:lim(ad.state,2), cep:soDigitos(ad.zip).slice(0,8),
    telefone: ph ? lim('('+ph.area+') '+ph.number,40) : '', email:lim(em&&em.address,150), fonte:'receita'};
}
async function consultarCnpj(c){
  var a = await buscaJson('https://brasilapi.com.br/api/cnpj/v1/'+c);
  if(a.json && a.json.razao_social) return {dados:normBrasilApi(a.json, c)};
  var b = await buscaJson('https://open.cnpja.com/office/'+c);
  if(b.json && b.json.company) return {dados:normCnpja(b.json, c)};
  if(a.naoAchou && (b.naoAchou || b.falhou)) return {naoAchou:true};
  return {falhou:true};
}

function cnpjFormHtml(px, cnpjFixo){
  return '<div class="auth-field"><label for="'+px+'-cnpj">CNPJ da construtora</label>' +
    '<div class="cnpj-linha"><input id="'+px+'-cnpj" inputmode="numeric" autocomplete="off" maxlength="18" placeholder="00.000.000/0000-00" value="'+esc(cnpjFixo?cnpjMascara(cnpjFixo):'')+'"'+(cnpjFixo?' readonly':'')+'>' +
    '<button type="button" class="btn" id="'+px+'-buscar">'+(cnpjFixo?'Atualizar dados':'Buscar dados')+'</button></div></div>' +
    '<div id="'+px+'-dados"></div>';
}
function cardCnpjHtml(d){
  var alerta = sitAlerta(d.situacao);
  var linhas = [['CNPJ', cnpjMascara(d.cnpj)], ['Situação', d.situacao?'<span class="cnpj-sit'+(alerta?' alerta':'')+'">'+esc(d.situacao)+'</span>':''],
    ['Abertura', dataBR(d.data_abertura)], ['Natureza', d.natureza_juridica], ['Porte', d.porte], ['Atividade', d.cnae_principal],
    ['Endereço', enderecoTexto(d)], ['Telefone', d.telefone], ['E-mail', d.email]];
  return '<div class="cnpj-card"><h4>'+esc(d.razao_social)+'</h4>' + (d.nome_fantasia?'<div class="cnpj-fant">'+esc(d.nome_fantasia)+'</div>':'<div style="height:8px"></div>') +
    '<dl>'+linhas.filter(function(l){ return l[1]; }).map(function(l){ return '<dt>'+l[0]+'</dt><dd>'+(l[0]==='Situação'?l[1]:esc(l[1]))+'</dd>'; }).join('')+'</dl>' +
    (alerta?'<div class="auth-warn" style="margin-top:10px">A situação na Receita não é ATIVA. Confira antes de continuar.</div>':'') +
    '<div class="cnpj-fonte">'+(d.fonte==='manual'?'Dados informados manualmente.':'Fonte: base pública do CNPJ da Receita Federal (atualizada mensalmente).')+
    ' <a href="'+RECEITA_URL+'" target="_blank" rel="noopener noreferrer">Conferir no site da Receita</a></div></div>';
}
function manualHtml(px, motivo){
  return '<p class="cnpj-msg">'+esc(motivo)+' Preencha os dados abaixo como estão no cartão CNPJ. <a href="'+RECEITA_URL+'" target="_blank" rel="noopener noreferrer">Abrir o site da Receita</a></p>' +
    '<div class="cnpj-manual">' +
    '<div class="auth-field"><label for="'+px+'-rs">Razão social</label><input id="'+px+'-rs" maxlength="200" required></div>' +
    '<div class="auth-field"><label for="'+px+'-nf">Nome fantasia (opcional)</label><input id="'+px+'-nf" maxlength="200"></div>' +
    '<div class="duo"><div class="auth-field"><label for="'+px+'-mun">Município</label><input id="'+px+'-mun" maxlength="120"></div>' +
    '<div class="auth-field"><label for="'+px+'-uf">UF</label><input id="'+px+'-uf" maxlength="2" style="text-transform:uppercase"></div></div></div>';
}
function wireCnpj(px, onOk){
  var inp=document.getElementById(px+'-cnpj'), btn=document.getElementById(px+'-buscar'), box=document.getElementById(px+'-dados');
  if(!inp||!btn||!box) return;
  CNPJ_BUSCA[px]=null;
  var ultimo='';
  async function buscar(){
    var c=soDigitos(inp.value);
    if(!cnpjValido(c)){ CNPJ_BUSCA[px]=null; box.innerHTML='<p class="cnpj-msg">'+(c.length<14?'Digite os 14 números do CNPJ.':'CNPJ inválido. Confira os números.')+'</p>'; return; }
    ultimo=c; btn.disabled=true; box.innerHTML='<p class="cnpj-msg">Consultando a Receita Federal…</p>';
    var res = await consultarCnpj(c);
    btn.disabled=false;
    if(soDigitos(inp.value)!==c) return;
    if(res.dados){ CNPJ_BUSCA[px]={cnpj:c, dados:res.dados}; box.innerHTML=cardCnpjHtml(res.dados); }
    else { CNPJ_BUSCA[px]={cnpj:c, manual:true};
      box.innerHTML=manualHtml(px, res.naoAchou ? 'Este CNPJ ainda não aparece na base pública (CNPJs abertos há menos de um mês podem demorar).' : 'Não foi possível consultar a Receita agora.'); }
    if(onOk) onOk();
  }
  inp.oninput=function(){ if(inp.readOnly) return; inp.value=cnpjMascara(inp.value); var c=soDigitos(inp.value);
    if(c.length===14 && c!==ultimo) buscar(); else if(c.length<14){ ultimo=''; CNPJ_BUSCA[px]=null; box.innerHTML=''; } };
  btn.onclick=buscar;
  if(inp.readOnly) return;
}
function cnpjSelecionado(px){
  var s=CNPJ_BUSCA[px];
  if(!s){ var c=soDigitos(val(px+'-cnpj')); return c.length<14 ? 'Informe o CNPJ da construtora.' : (cnpjValido(c)?'Clique em "Buscar dados" para consultar o CNPJ.':'CNPJ inválido. Confira os números.'); }
  if(s.manual){
    var rs=lim(val(px+'-rs'),200); if(!rs) return 'Informe a razão social.';
    return {cnpj:s.cnpj, dados:{cnpj:s.cnpj, razao_social:rs, nome_fantasia:lim(val(px+'-nf'),200), municipio:lim(val(px+'-mun'),120), uf:lim(val(px+'-uf'),2).toUpperCase(), fonte:'manual'}};
  }
  if(String(s.dados.situacao).toUpperCase()==='BAIXADA' || String(s.dados.situacao).toUpperCase()==='NULA') return 'Este CNPJ está '+s.dados.situacao.toLowerCase()+' na Receita Federal e não pode ser cadastrado.';
  return {cnpj:s.cnpj, dados:s.dados};
}

/* ---------- perfil da construtora ---------- */
var PERFIL = {dados:null};
var PERFIL_COLS = 'id,nome,cnpj,razao_social,nome_fantasia,situacao,data_abertura,natureza_juridica,porte,cnae_principal,logradouro,numero,complemento,bairro,municipio,uf,cep,telefone,email_receita,fonte_dados,dados_atualizados_em';
async function carregarPerfil(){
  var r=await supabaseClient.from('construtoras').select(PERFIL_COLS).eq('id', CTX.cid).maybeSingle();
  if(r.error) throw r.error;
  var d=r.data||{};
  PERFIL.dados = {cnpj:soDigitos(d.cnpj), razao_social:lim(d.razao_social,200), nome_fantasia:lim(d.nome_fantasia,200), situacao:lim(d.situacao,40),
    data_abertura:lim(d.data_abertura,10), natureza_juridica:lim(d.natureza_juridica,150), porte:lim(d.porte,60), cnae_principal:lim(d.cnae_principal,250),
    logradouro:lim(d.logradouro,200), numero:lim(d.numero,30), complemento:lim(d.complemento,150), bairro:lim(d.bairro,120), municipio:lim(d.municipio,120),
    uf:lim(d.uf,2), cep:soDigitos(d.cep), telefone:lim(d.telefone,40), email:lim(d.email_receita,150), fonte:d.fonte_dados==='manual'?'manual':'receita',
    nome:lim(d.nome,120), atualizado:lim(d.dados_atualizados_em,40)};
  return PERFIL.dados;
}
async function verificarCadastroCnpj(){
  if(!ehAdmin()) return;
  try{ var d=await carregarPerfil(); if(!d.cnpj) openPerfil(true); }catch(e){}
}
function perfilHost(){ var h=document.getElementById('perfil-host'); if(!h){ h=document.createElement('div'); h.id='perfil-host'; document.body.appendChild(h); } return h; }
function closePerfil(){ var d=document.getElementById('dlg-perfil'); if(d && d.open) d.close(); }
async function openPerfil(pedirCnpj){
  if(!CTX) return;
  var h=perfilHost();
  h.innerHTML='<dialog id="dlg-perfil" class="modal-wide"><div class="modal-head"><h3>Construtora</h3></div><div class="modal-body" id="perfil-body"><p class="auth-sub">Carregando…</p></div>' +
    '<div class="modal-foot"><button type="button" class="btn" id="perfil-fechar">Fechar</button></div></dialog>';
  document.getElementById('perfil-fechar').onclick=closePerfil;
  document.getElementById('dlg-perfil').showModal();
  try{ await carregarPerfil(); }catch(e){ document.getElementById('perfil-body').innerHTML='<p class="auth-msg err">'+esc(traduzErro(e))+'</p>'; return; }
  renderPerfil(pedirCnpj);
}
function renderPerfil(pedirCnpj){
  var b=document.getElementById('perfil-body'); if(!b) return;
  var d=PERFIL.dados, adm=ehAdmin(), html='';
  if(!d.cnpj){
    html = adm ? '<div class="auth-warn" style="margin-bottom:16px">'+(pedirCnpj?'Falta um passo: ':'')+'esta construtora foi cadastrada só pelo nome. Informe o CNPJ para completar o cadastro com os dados da Receita Federal.</div>' +
        cnpjFormHtml('pf') + '<button type="button" class="btn btn-accent" id="pf-salvar">Salvar dados da construtora</button><div class="auth-msg" id="pf-msg"></div>'
      : '<p class="auth-sub"><b>'+esc(d.nome)+'</b></p><p class="auth-sub">O administrador ainda não informou o CNPJ desta construtora.</p>';
  }else{
    html = cardCnpjHtml(d) + (d.atualizado?'<p class="cnpj-fonte" style="margin-top:-8px">Dados gravados em '+esc(new Date(d.atualizado).toLocaleDateString('pt-BR'))+'.</p>':'');
    if(adm) html += '<div style="margin-top:14px">'+cnpjFormHtml('pf', d.cnpj)+'</div><button type="button" class="btn btn-accent" id="pf-salvar" style="display:none">Salvar dados atualizados</button><div class="auth-msg" id="pf-msg"></div>';
  }
  b.innerHTML=html;
  if(!adm) return;
  var salvar=document.getElementById('pf-salvar');
  wireCnpj('pf', function(){ if(d.cnpj) salvar.style.display=''; });
  salvar.onclick=async function(){
    var sel=cnpjSelecionado('pf'), m=document.getElementById('pf-msg');
    if(typeof sel==='string'){ m.textContent=sel; m.className='auth-msg err'; return; }
    salvar.disabled=true; m.textContent='';
    try{
      var r=await supabaseClient.rpc('atualizar_construtora', {p_cid:CTX.cid, p_cnpj:sel.cnpj, p_dados:sel.dados}); if(r.error) throw r.error;
      CTX.nome = nomeExibicao(sel.dados); render(); await carregarPerfil(); renderPerfil(false);
      var m2=document.getElementById('pf-msg'); if(m2){ m2.textContent='Dados da construtora salvos.'; m2.className='auth-msg ok'; }
    }catch(err){ m.textContent=traduzErro(err); m.className='auth-msg err'; salvar.disabled=false; }
  };
}


/* ============================== assinatura (Asaas) ============================== */
var SIT_TXT = {teste:'Teste grátis', em_dia:'Em dia', vencida:'Vencida', bloqueada:'Bloqueada', cancelada:'Cancelada', liberada:'Liberada'};
var FAT_TXT = {PENDING:'Em aberto', OVERDUE:'Vencida', RECEIVED:'Paga', CONFIRMED:'Paga', RECEIVED_IN_CASH:'Paga', REFUNDED:'Estornada',
  REFUND_REQUESTED:'Estorno pedido', CHARGEBACK_REQUESTED:'Contestada', CHARGEBACK_DISPUTE:'Contestada', AWAITING_CHARGEBACK_REVERSAL:'Contestada', DUNNING_REQUESTED:'Em cobrança', AWAITING_RISK_ANALYSIS:'Em análise'};
var FORMA_TXT = {PIX:'Pix', BOLETO:'Boleto', CREDIT_CARD:'Cartão', UNDEFINED:'A escolher'};
function sitPill(s){ s=String(s||''); return '<span class="sit sit-'+esc(s)+'">'+esc(SIT_TXT[s]||s)+'</span>'; }
function dtBR(v){ if(!v) return ''; var d=new Date(String(v).length===10?v+'T12:00:00':v); return isNaN(d)?'':d.toLocaleDateString('pt-BR'); }
function linkAsaasOk(u){ return /^https:\/\/([a-z0-9-]+\.)*asaas\.com\//i.test(String(u||'')); }
function fecharDlg(id){ var d=document.getElementById(id); if(d && d.open) d.close(); }
function dlgHost(id){ var h=document.getElementById(id+'-host'); if(!h){ h=document.createElement('div'); h.id=id+'-host'; document.body.appendChild(h); } return h; }
function abrirDlg(id, titulo){
  dlgHost(id).innerHTML='<dialog id="'+id+'" class="modal-wide"><div class="modal-head"><h3>'+esc(titulo)+'</h3></div><div class="modal-body" id="'+id+'-body"><p class="auth-sub">Carregando…</p></div>' +
    '<div class="modal-foot"><button type="button" class="btn" id="'+id+'-fechar">Fechar</button></div></dialog>';
  document.getElementById(id+'-fechar').onclick=function(){ fecharDlg(id); };
  document.getElementById(id).showModal();
  return document.getElementById(id+'-body');
}

async function pedirLinkPagamento(){
  var r = await supabaseClient.functions.invoke('assinatura-checkout', {body:{cid:CTX.cid}});
  if(r.error){
    var msg='Não foi possível gerar a cobrança agora. Tente de novo em alguns minutos.';
    try{ var j = r.error.context && r.error.context.json ? await r.error.context.json() : null; if(j && j.erro) msg = String(j.erro).slice(0,200); }catch(e){}
    throw new Error(msg);
  }
  var d = r.data || {};
  if(d.erro) throw new Error(String(d.erro).slice(0,200));
  if(d.link && !linkAsaasOk(d.link)) throw new Error('Link de pagamento inválido.');
  return d;
}
async function gerarLinkBloqueado(){
  if(!ehAdmin()) return;
  var b=document.getElementById('auth-btn'); if(b) b.disabled=true;
  authMsg('Gerando a cobrança…', true);
  try{
    var d = await pedirLinkPagamento();
    if(!d.link){ authMsg(d.mensagem||'Nenhuma fatura em aberto.', true); return; }
    ASSIN_BLOQ.link = d.link; renderAuth();
  }catch(e){ authMsg(e.message); if(b) b.disabled=false; }
}
async function verificarPagamento(){
  authMsg('Verificando…', true);
  try{
    var u = await supabaseClient.auth.getUser();
    if(u.error || !u.data || !u.data.user) return doLogout();
    var antes = ASSIN_BLOQ;
    await afterLogin(u.data.user);
    if(authView==='assinatura'){ if(antes && antes.link) ASSIN_BLOQ.link=antes.link; renderAuth(); authMsg('Pagamento ainda não confirmado. Pix e cartão levam alguns minutos; boleto, até 3 dias úteis.'); }
    else toast('Pagamento confirmado. Bem-vindo de volta!');
  }catch(e){ authMsg(traduzErro(e)); }
}

async function openAssinatura(){
  if(!ehAdmin()) return;
  var b = abrirDlg('dlg-assin', 'Assinatura');
  var r = await supabaseClient.rpc('minha_assinatura', {p_cid:CTX.cid});
  if(r.error){ b.innerHTML='<p class="auth-msg err">'+esc(traduzErro(r.error))+'</p>'; return; }
  renderAssinatura(r.data||{});
}
function renderAssinatura(a){
  var b=document.getElementById('dlg-assin-body'); if(!b) return;
  var s=String(a.situacao||''), tol=+a.tolerancia||0, txt='';
  function mais(v,d){ if(!v) return null; var x=new Date(v); x.setDate(x.getDate()+d); return x; }
  if(s==='teste') txt='Teste grátis até <b>'+dtBR(a.teste_ate)+'</b>. Para continuar usando depois disso, pague a primeira mensalidade.';
  else if(s==='em_dia') txt='Mensalidade paga. Acesso garantido até <b>'+dtBR(a.acesso_ate)+'</b>; a próxima fatura chega por e-mail.';
  else if(s==='liberada') txt='Acesso liberado até <b>'+dtBR(a.liberado_ate)+'</b>.';
  else if(s==='vencida'){ var lim2 = mais(a.acesso_ate||a.teste_ate, tol); txt='Mensalidade vencida. Pague até <b>'+(lim2?lim2.toLocaleDateString('pt-BR'):'')+'</b> para não ter o acesso pausado.'; }
  else if(s==='cancelada') txt='Assinatura cancelada.';
  var fats = (a.faturas||[]);
  var tabela = fats.length ? '<div class="usr-table"><table><thead><tr><th>Vencimento</th><th>Valor</th><th>Situação</th><th>Forma</th><th>Pago em</th><th></th></tr></thead><tbody>' +
    fats.map(function(f){ var st=String(f.status||'');
      return '<tr><td>'+esc(dtBR(f.vencimento))+'</td><td>'+esc(fmtBRL(+f.valor||0))+'</td><td>'+esc(FAT_TXT[st]||st)+'</td><td>'+esc(FORMA_TXT[f.forma]||f.forma||'')+'</td><td>'+esc(dtBR(f.pago_em))+'</td>' +
        '<td style="text-align:right">'+(linkAsaasOk(f.link)?'<a href="'+esc(f.link)+'" target="_blank" rel="noopener noreferrer">'+((st==='PENDING'||st==='OVERDUE')?'Pagar':'Ver')+'</a>':'')+'</td></tr>'; }).join('') +
    '</tbody></table></div>' : '<p class="auth-sub">Nenhuma fatura ainda. A primeira é gerada quando você clicar em "Pagar mensalidade".</p>';
  b.innerHTML = '<div class="assin-box"><div>'+sitPill(s)+'</div><div class="assin-valor">'+esc(fmtBRL(+a.valor||0))+'<span style="font-size:13px;font-weight:500;color:var(--ink-muted)"> / mês</span></div><p>'+txt+'</p>' +
    (s!=='cancelada' && s!=='liberada' ? '<div class="assin-pagar"><button type="button" class="btn btn-accent" id="assin-pagar">'+(s==='em_dia'?'Ver fatura em aberto':'Pagar mensalidade')+'</button><span id="assin-link"></span></div><div class="auth-msg" id="assin-msg"></div>' : '') +
    '<p class="assin-nota">Pagamento por Pix, boleto ou cartão, processado pelo Asaas. Pix e cartão liberam em minutos; boleto em até 3 dias úteis.</p></div>' +
    '<h4 style="margin:4px 0 6px">Faturas</h4>' + tabela;
  var pg=document.getElementById('assin-pagar');
  if(pg) pg.onclick=async function(){
    var m=document.getElementById('assin-msg'); pg.disabled=true; m.textContent='Gerando a cobrança…'; m.className='auth-msg ok';
    try{
      var d=await pedirLinkPagamento();
      if(!d.link){ m.textContent=d.mensagem||'Nenhuma fatura em aberto.'; pg.disabled=false; return; }
      m.textContent=''; document.getElementById('assin-link').innerHTML='<a class="btn assin-link" href="'+esc(d.link)+'" target="_blank" rel="noopener noreferrer">Abrir fatura ('+esc(dtBR(d.vencimento))+')</a>';
    }catch(e){ m.textContent=e.message; m.className='auth-msg err'; pg.disabled=false; }
  };
}

/* ---------- painel do dono ---------- */
var DONO = {dados:null, busca:''};
async function openDono(){
  if(!EH_DONO) return;
  abrirDlg('dlg-dono', 'Painel do dono');
  await carregarDono();
}
async function carregarDono(){
  var r=await supabaseClient.rpc('dono_painel');
  var b=document.getElementById('dlg-dono-body'); if(!b) return;
  if(r.error){ b.innerHTML='<p class="auth-msg err">'+esc(traduzErro(r.error))+'</p>'; return; }
  DONO.dados=r.data||{}; renderDono();
}
function renderDono(){
  var b=document.getElementById('dlg-dono-body'); if(!b||!DONO.dados) return;
  var d=DONO.dados, lista=d.construtoras||[], cfg=d.config||{};
  var cont={}; lista.forEach(function(c){ cont[c.situacao]=(cont[c.situacao]||0)+1; });
  var mrr=lista.filter(function(c){ return c.situacao==='em_dia'||c.situacao==='vencida'; }).filter(function(c){ return c.tem_assinatura; })
               .reduce(function(s,c){ return s+(+c.valor||0); },0);
  var inad=(cont.vencida||0)+lista.filter(function(c){ return c.situacao==='bloqueada' && c.ultimo_pagamento; }).length;
  var q=DONO.busca.trim().toLowerCase();
  var filtrada=lista.filter(function(c){ return !q || [c.nome,c.razao_social,c.cnpj,c.admin_email].some(function(x){ return String(x||'').toLowerCase().indexOf(q)>=0; }); });
  var cards='<div class="dono-cards">' +
    '<div class="dono-card"><span>Receita mensal (MRR)</span><b>'+esc(fmtBRL(mrr))+'</b></div>' +
    '<div class="dono-card"><span>Recebido neste mês</span><b>'+esc(fmtBRL(+d.recebido_mes||0))+'</b></div>' +
    '<div class="dono-card"><span>Em dia</span><b>'+((cont.em_dia||0))+'</b></div>' +
    '<div class="dono-card"><span>Em teste</span><b>'+((cont.teste||0))+'</b></div>' +
    '<div class="dono-card"><span>Inadimplentes</span><b style="color:var(--critical)">'+inad+'</b></div>' +
    '<div class="dono-card"><span>Bloqueadas / canceladas</span><b>'+((cont.bloqueada||0)+(cont.cancelada||0))+'</b></div></div>';
  var form='<form class="dono-cfg" id="dono-cfg">' +
    '<div class="auth-field"><label for="cfg-valor">Mensalidade (R$)</label><input id="cfg-valor" inputmode="decimal" value="'+esc(String(cfg.valor_mensal||'').replace('.',','))+'"></div>' +
    '<div class="auth-field"><label for="cfg-teste">Dias de teste grátis</label><input id="cfg-teste" inputmode="numeric" value="'+esc(cfg.dias_teste)+'"></div>' +
    '<div class="auth-field"><label for="cfg-tol">Dias de tolerância</label><input id="cfg-tol" inputmode="numeric" value="'+esc(cfg.dias_tolerancia)+'"></div>' +
    '<button type="submit" class="btn">Salvar valores</button></form><div class="auth-msg" id="dono-msg"></div>';
  var tabela='<div class="usr-busca"><input id="dono-q" type="search" placeholder="Pesquisar construtora, CNPJ ou e-mail" value="'+esc(DONO.busca)+'"><span class="usr-cont">'+lista.length+' construtora'+(lista.length===1?'':'s')+'</span></div>' +
    '<div class="usr-table"><table><thead><tr><th>Construtora</th><th>Administrador</th><th>Situação</th><th>Acesso até</th><th>Último pag.</th><th>Valor</th><th>Ações</th></tr></thead><tbody>' +
    (filtrada.length ? filtrada.map(function(c){
      var ate = c.situacao==='liberada' ? c.liberado_ate : (c.situacao==='teste' ? c.teste_ate : (c.acesso_ate||c.teste_ate));
      var ac = '<button class="usr-mini" data-dono="liberar_ate" data-id="'+esc(c.id)+'">Liberar até…</button>' +
               '<button class="usr-mini" data-dono="estender_dias" data-id="'+esc(c.id)+'">+ Dias…</button>' +
               '<button class="usr-mini" data-dono="valor" data-id="'+esc(c.id)+'">Valor…</button>' +
               (c.liberado_ate?'<button class="usr-mini" data-dono="remover_liberacao" data-id="'+esc(c.id)+'">Tirar liberação</button>':'') +
               (c.cancelada?'<button class="usr-mini" data-dono="reativar" data-id="'+esc(c.id)+'">Reativar</button>':'<button class="usr-mini del" data-dono="cancelar" data-id="'+esc(c.id)+'" data-nome="'+esc(c.nome)+'">Cancelar</button>');
      return '<tr><td><b>'+esc(c.nome)+'</b><span class="dono-sub">'+esc(c.cnpj?cnpjMascara(c.cnpj):'sem CNPJ')+' · '+esc(c.usuarios)+' usuário'+(+c.usuarios===1?'':'s')+'</span></td>' +
        '<td>'+esc(c.admin_email||'')+'</td><td>'+sitPill(c.situacao)+'</td><td>'+esc(dtBR(ate))+'</td><td>'+esc(dtBR(c.ultimo_pagamento))+'</td>' +
        '<td>'+esc(fmtBRL(+c.valor||0))+'</td><td class="usr-acoes">'+ac+'</td></tr>';
    }).join('') : '<tr><td colspan="7" style="color:var(--ink-muted);padding:16px 10px">Nenhuma construtora.</td></tr>') +
    '</tbody></table></div><p class="assin-nota">Cancelar aqui bloqueia o acesso no painel. Cancele também a assinatura no Asaas para parar de gerar cobranças. Mudanças no valor valem para as próximas assinaturas criadas.</p>';
  b.innerHTML = cards + form + tabela;
  document.getElementById('dono-cfg').onsubmit=async function(e){ e.preventDefault();

    if(!(v>0) || !(t>=0&&t<=90) || !(tl>=0&&tl<=30)){ m.textContent='Confira os valores (teste de 0 a 90 dias, tolerância de 0 a 30).'; m.className='auth-msg err'; return; }
    var r=await supabaseClient.rpc('dono_config',{p_valor:v,p_teste:t,p_tolerancia:tl});
    if(r.error){ m.textContent=traduzErro(r.error); m.className='auth-msg err'; } else { await carregarDono(); var m2=document.getElementById('dono-msg'); if(m2){ m2.textContent='Valores salvos.'; m2.className='auth-msg ok'; } }
  };
  var qi=document.getElementById('dono-q'); qi.oninput=function(){ DONO.busca=qi.value; renderDono(); var q2=document.getElementById('dono-q'); if(q2){ q2.focus(); q2.setSelectionRange(q2.value.length,q2.value.length); } };
  Array.prototype.forEach.call(b.querySelectorAll('[data-dono]'), function(el){ el.onclick=function(){ acaoDono(el.dataset.id, el.dataset.dono, el.dataset.nome); }; });
}
async function acaoDono(id, acao, nome){
  var valor=null;
  if(acao==='liberar_ate'){ var s=prompt('Liberar o acesso até qual data? (dd/mm/aaaa)'); if(!s) return; var mm=s.trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if(!mm) return alert('Data inválida. Use dd/mm/aaaa.'); valor=mm[3]+'-'+mm[2]+'-'+mm[1]; }
  else if(acao==='estender_dias'){ var n=prompt('Estender o acesso por quantos dias? (1 a 365)'); if(!n) return; n=parseInt(n,10); if(!(n>=1&&n<=365)) return alert('Informe de 1 a 365 dias.'); valor=String(n); }
  else if(acao==='valor'){ var vv=prompt('Novo valor da mensalidade desta construtora (R$):'); if(!vv) return; vv=parseFloat(vv.replace(/\./g,'').replace(',','.')); if(!(vv>0)) return alert('Valor inválido.'); valor=String(vv); }
  else if(acao==='cancelar'){ if(!confirm('Cancelar a assinatura de '+(nome||'esta construtora')+'? O acesso é bloqueado na hora (os dados ficam guardados).')) return; }
  var r=await supabaseClient.rpc('dono_acao',{p_cid:id, p_acao:acao, p_valor:valor});
  if(r.error) alert(traduzErro(r.error));
  await carregarDono();
}

/* ---------- gestão de usuários (admin) ---------- */
var USR = {lista:[], carregando:false, busca:'', filtro:'todos'};
function usuariosHost(){
  var h=document.getElementById('usuarios-host');
  if(!h){ h=document.createElement('div'); h.id='usuarios-host'; document.body.appendChild(h); }
  return h;
}
function closeUsuarios(){ var d=document.getElementById('dlg-usuarios'); if(d && d.open) d.close(); }
async function openUsuarios(){
  if(!ehAdmin()) return;
  var h=usuariosHost();
  USR.busca=''; USR.filtro='todos';
  h.innerHTML='<dialog id="dlg-usuarios" class="modal-wide"><div class="modal-head"><h3>Usuários da '+esc(CTX.nome)+'</h3></div><div class="modal-body" id="usr-body"></div>' +
    '<div class="modal-foot"><button type="button" class="btn" id="usr-fechar">Fechar</button></div></dialog>';
  document.getElementById('usr-fechar').onclick=closeUsuarios;
  document.getElementById('dlg-usuarios').showModal();
  renderUsuarios();
  if(supabaseReady) await carregarUsuarios();
}
async function carregarUsuarios(){
  USR.carregando=true; renderUsuarios();
  var r=await supabaseClient.from('membros').select('id,email,nome,whatsapp,papel,status,ativo,user_id,criado_em,inativado_em').eq('construtora_id', CTX.cid).order('criado_em');
  USR.carregando=false;
  if(r.error){ USR.erro=traduzErro(r.error); } else { USR.erro=null; USR.lista=r.data||[]; }
  renderUsuarios();
}
function foneMascara(v){ v=soDigitos(v).slice(0,11); if(v.length<3) return v; if(v.length<=6) return '('+v.slice(0,2)+') '+v.slice(2);
  return '('+v.slice(0,2)+') '+v.slice(2, v.length-4)+'-'+v.slice(-4); }
function usrFiltrados(){
  var q=USR.busca.trim().toLowerCase();
  return USR.lista.filter(function(m){
    var at = m.ativo!==false;
    if(USR.filtro==='ativos' && !at) return false;
    if(USR.filtro==='inativos' && at) return false;
    if(!q) return true;
    return [m.nome,m.email,m.whatsapp,foneMascara(m.whatsapp||'')].some(function(x){ return String(x||'').toLowerCase().indexOf(q)>=0; });
  });
}
function usrLinhas(){
  var lista=usrFiltrados();
  if(!lista.length) return '<tr><td colspan="6" style="color:var(--ink-muted);padding:18px 10px">'+(USR.lista.length?'Nenhum usuário encontrado com esse filtro.':'Nenhum usuário ainda.')+'</td></tr>';
  return lista.map(function(m){
    var eu = String(m.email).toLowerCase()===String(AUTH_USER).toLowerCase(), at = m.ativo!==false;
    var nome = eu ? esc(m.nome||'—') : '<input class="usr-in" data-usr="nome" data-id="'+esc(m.id)+'" maxlength="120" placeholder="Nome" value="'+esc(m.nome||'')+'" aria-label="Nome">';
    var zap = eu ? esc(m.whatsapp?foneMascara(m.whatsapp):'—') : '<input class="usr-in" data-usr="whatsapp" data-id="'+esc(m.id)+'" inputmode="tel" maxlength="16" placeholder="(00) 00000-0000" value="'+esc(m.whatsapp?foneMascara(m.whatsapp):'')+'" aria-label="WhatsApp">';
    var papel = eu ? '<span>'+PAPEIS[m.papel]+' (você)</span>' :
      '<select data-usr="papel" data-id="'+esc(m.id)+'">'+Object.keys(PAPEIS).map(function(k){ return '<option value="'+k+'"'+(m.papel===k?' selected':'')+'>'+PAPEIS[k]+'</option>'; }).join('')+'</select>';
    var st = !at ? (m.inativado_em?'<span class="usr-sub off">Inativado em '+esc(new Date(m.inativado_em).toLocaleDateString('pt-BR'))+'</span>':'') :
      (m.status==='ativo' ? '' : '<span class="usr-sub">Convite pendente</span>');
    var ativoTxt = '<span class="usr-ativo'+(at?'':' nao')+'">'+(at?'Sim':'Não')+'</span>';
    var acoes = eu ? '' :
      (at ? '<button class="btn btn-sm btn-inativar" data-usr="inativar" data-id="'+esc(m.id)+'" data-email="'+esc(m.email)+'">Inativar</button> '
          : '<button class="btn btn-sm btn-reativar" data-usr="reativar" data-id="'+esc(m.id)+'" data-email="'+esc(m.email)+'">Reativar</button> ') +
      (at && m.status!=='ativo' ? '<button class="usr-mini" data-usr="reenviar" data-email="'+esc(m.email)+'">Reenviar</button>' : '') +
      (m.status!=='ativo' ? '<button class="usr-mini del" data-usr="remover" data-id="'+esc(m.id)+'" data-email="'+esc(m.email)+'">Excluir</button>' : '');
    return '<tr'+(at?'':' class="inativo"')+'><td>'+nome+'</td><td>'+esc(m.email)+st+'</td><td>'+zap+'</td><td>'+papel+'</td><td>'+ativoTxt+'</td><td class="usr-acoes">'+acoes+'</td></tr>';
  }).join('');
}
function renderUsuarios(){
  var b=document.getElementById('usr-body'); if(!b) return;
  var avisoLink = location.protocol==='file:' ? '<div class="auth-warn" style="margin-bottom:14px">O painel está aberto direto do computador (file://). O link do convite só funciona com o painel publicado num endereço https, cadastrado em Authentication &gt; URL Configuration.</div>' : '';
  var form='<form id="usr-form" class="usr-form v2">' +
    '<div class="auth-field"><label for="usr-nome">Nome</label><input id="usr-nome" type="text" maxlength="120" placeholder="Nome do usuário"></div>' +
    '<div class="auth-field"><label for="usr-email">E-mail</label><input id="usr-email" type="email" required placeholder="nome@empresa.com.br"></div>' +
    '<div class="auth-field"><label for="usr-zap">WhatsApp</label><input id="usr-zap" type="text" inputmode="tel" maxlength="16" placeholder="(00) 00000-0000"></div>' +
    '<div class="auth-field"><label for="usr-papel">Permissão</label><select id="usr-papel"><option value="editor">Edição: vê e altera tudo</option><option value="leitor">Visualização: só vê</option><option value="admin">Administrador: tudo + usuários</option></select></div>' +
    '<button type="submit" class="btn btn-accent" id="usr-add">Cadastrar e enviar convite</button></form><div class="auth-msg" id="usr-msg"></div>';
  var nAt=USR.lista.filter(function(m){ return m.ativo!==false; }).length, nIn=USR.lista.length-nAt;
  var busca='<div class="usr-busca"><input id="usr-q" type="search" placeholder="Pesquisar por nome, e-mail ou WhatsApp" value="'+esc(USR.busca)+'" aria-label="Pesquisar usuários">' +
    '<div class="usr-filtro" role="group" aria-label="Filtrar usuários">' +
      [['todos','Todos'],['ativos','Ativos'],['inativos','Inativos']].map(function(f){ return '<button type="button" data-filtro="'+f[0]+'" class="'+(USR.filtro===f[0]?'on':'')+'">'+f[1]+'</button>'; }).join('') +
    '</div><span class="usr-cont">'+nAt+' ativo'+(nAt===1?'':'s')+(nIn?' · '+nIn+' inativo'+(nIn===1?'':'s'):'')+'</span></div>';
  var rows = USR.carregando ? '<p class="auth-sub">Carregando…</p>' : (USR.erro ? '<p class="auth-msg err">'+esc(USR.erro)+'</p>' :
    '<div class="usr-table"><table><thead><tr><th>Nome</th><th>E-mail</th><th>WhatsApp</th><th>Permissão</th><th>Ativo</th><th>Ações</th></tr></thead><tbody id="usr-tbody">' +
    usrLinhas() + '</tbody></table></div>');
  b.innerHTML = avisoLink + form + busca + rows;
  document.getElementById('usr-form').onsubmit=function(e){ e.preventDefault(); convidar(); };
  var zapNovo=document.getElementById('usr-zap'); zapNovo.oninput=function(){ zapNovo.value=foneMascara(zapNovo.value); };
  var q=document.getElementById('usr-q');
  q.oninput=function(){ USR.busca=q.value; var tb=document.getElementById('usr-tbody'); if(tb){ tb.innerHTML=usrLinhas(); ligarLinhas(b); } };
  Array.prototype.forEach.call(b.querySelectorAll('[data-filtro]'), function(el){ el.onclick=function(){ USR.filtro=el.dataset.filtro; renderUsuarios(); var q2=document.getElementById('usr-q'); if(q2) q2.focus(); }; });
  ligarLinhas(b);
}
function ligarLinhas(b){
  Array.prototype.forEach.call(b.querySelectorAll('[data-usr]'), function(el){
    var tipo=el.dataset.usr;
    if(tipo==='papel') el.onchange=function(){ alterarPapel(el.dataset.id, el.value); };
    if(tipo==='nome') el.onchange=function(){ alterarCampo(el.dataset.id, {nome: lim(el.value,120) || null}, 'Nome salvo.'); };
    if(tipo==='whatsapp'){ el.oninput=function(){ el.value=foneMascara(el.value); };
      el.onchange=function(){ var d=soDigitos(el.value); if(d && (d.length<10||d.length>11)) return usrMsg('WhatsApp inválido. Use DDD + número.'); alterarCampo(el.dataset.id, {whatsapp: d || null}, 'WhatsApp salvo.'); }; }
    if(tipo==='inativar') el.onclick=function(){ alterarAtivo(el.dataset.id, el.dataset.email, false); };
    if(tipo==='reativar') el.onclick=function(){ alterarAtivo(el.dataset.id, el.dataset.email, true); };
    if(tipo==='reenviar') el.onclick=function(){ enviarConvite(el.dataset.email).then(function(){ usrMsg('Convite reenviado para '+el.dataset.email+'.', true); }).catch(function(err){ usrMsg(traduzErro(err)); }); };
    if(tipo==='remover') el.onclick=function(){ removerUsuario(el.dataset.id, el.dataset.email); };
  });
}
function usrMsg(t, ok){ var m=document.getElementById('usr-msg'); if(m){ m.textContent=t; m.className='auth-msg '+(ok?'ok':'err'); } }
async function alterarCampo(id, campos, okMsg){
  var r=await supabaseClient.from('membros').update(campos).eq('id', id);
  if(r.error){ usrMsg(traduzErro(r.error)); await carregarUsuarios(); return; }
  var m=USR.lista.find(function(x){ return x.id===id; }); if(m) Object.keys(campos).forEach(function(k){ m[k]=campos[k]; });
  usrMsg(okMsg, true);
}
async function alterarAtivo(id, email, ativo){
  var txt = ativo ? 'Reativar o acesso de '+email+'? A pessoa volta a entrar no painel com a mesma permissão de antes.'
                  : 'Inativar o acesso de '+email+'? A pessoa não consegue mais entrar nem ver os dados desta construtora. Você pode reativar quando quiser.';
  if(!confirm(txt)) return;
  var r=await supabaseClient.from('membros').update({ativo:ativo}).eq('id', id);
  if(r.error) usrMsg(traduzErro(r.error)); else usrMsg(ativo?'Acesso de '+email+' reativado.':'Acesso de '+email+' inativado.', true);
  await carregarUsuarios();
}
async function enviarConvite(email){
  var r=await supabaseClient.auth.signInWithOtp({email:email, options:{shouldCreateUser:true, emailRedirectTo:appUrl()}});
  if(r.error) throw r.error;
}
async function convidar(){
  var email=(document.getElementById('usr-email').value||'').trim().toLowerCase(), papel=document.getElementById('usr-papel').value;
  var nome=lim(document.getElementById('usr-nome').value,120), zap=soDigitos(document.getElementById('usr-zap').value);
  if(['admin','editor','leitor'].indexOf(papel)<0) return;
  if(!emailOk(email)) return usrMsg('Informe um e-mail válido.');
  if(zap && (zap.length<10 || zap.length>11)) return usrMsg('WhatsApp inválido. Use DDD + número.');
  var btn=document.getElementById('usr-add'); btn.disabled=true; usrMsg('');
  try{
    var r=await supabaseClient.from('membros').insert({construtora_id:CTX.cid, email:email, papel:papel, nome:nome||null, whatsapp:zap||null});
    if(r.error) throw r.error;
    await enviarConvite(email);
    await carregarUsuarios();
    usrMsg('Convite enviado para '+email+'. O usuário recebe um link para criar a senha.', true);
  }catch(err){
    await carregarUsuarios();
    usrMsg(traduzErro(err));
  }finally{ var b2=document.getElementById('usr-add'); if(b2) b2.disabled=false; }
}
async function alterarPapel(id, papel){
  if(['admin','editor','leitor'].indexOf(papel)<0) return;
  var r=await supabaseClient.from('membros').update({papel:papel}).eq('id', id);
  if(r.error){ usrMsg(traduzErro(r.error)); } else { usrMsg('Permissão atualizada.', true); }
  await carregarUsuarios();
}
async function removerUsuario(id, email){
  if(!confirm('Excluir o convite de '+email+'?')) return;
  var r=await supabaseClient.from('membros').delete().eq('id', id);
  if(r.error) usrMsg(traduzErro(r.error)); else usrMsg('Convite excluído.', true);
  await carregarUsuarios();
}

/* ============================== boot ============================== */
bootAuth();

})();
</script>
